<title>NET Law-Verse | The Universe of Law</title>
<meta name="description" content="Free UGC NET Law and CLAT PG preparation. Choose your exam.">
<link rel="icon" href="/favicon.ico">
<style>
  :root { --bg:#f3f5fb; --card:#ffffff; --text:#1b2140; --muted:#5b6385; --accent:#3d4fd1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12162b; --card:#1b2140; --text:#ffffff; --muted:#aab2d6; --accent:#7b8cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; padding:32px 20px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { font-size:2rem; margin:0 0 6px; font-weight:800; text-align:center; }
  p.sub { color:var(--muted); margin:0 0 36px; text-align:center; }
  .grid { display:grid; gap:16px; width:100%; max-width:760px;
          grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
  a.card { display:block; padding:28px 22px; border-radius:18px; background:var(--card);
           color:var(--text); text-decoration:none; border:1px solid rgba(120,130,180,.25);
           border-top:4px solid var(--accent); transition:transform .15s; }
  a.card:hover { transform:translateY(-4px); }
  a.card strong { display:block; font-size:1.25rem; margin-bottom:6px; }
  a.card span { color:var(--muted); font-size:.92rem; }
</style>
</head>

  </div>
