<script>window.MOCK={"n":13,"title":"Mock Test 6 (Hard)","minutes":120,"eyebrow":"UGC NET LAW · CODE 058 · HARD","blurb":"100 hard questions across all 10 units of the Law syllabus (10 per unit): concept, case-based, statement, match, assertion-reason and chronology types. 120 minutes, 2 marks each (200 marks), no negative marking. Every question carries the red tough mark.","questions":[{"s":"Jurisprudence and Legal Theory","t":"Concept","d":"Difficult","q":"In the Hohfeldian scheme of jural relations, which pair correctly gives the jural correlative and the jural opposite of a 'privilege (liberty)'?","o":["A. Correlative: right; Opposite: no-right","B. Correlative: liability; Opposite: disability","C. Correlative: no-right; Opposite: duty","D. Correlative: duty; Opposite: right"],"a":2,"e":"Privilege's correlative is no-right and its opposite is duty. Power/liability and immunity/disability are the other pairs."},{"s":"Jurisprudence and Legal Theory","t":"Match","d":"Difficult","q":"Match List I with List II.\nList I: I. Lon Fuller  II. Joseph Raz  III. Ronald Dworkin  IV. John Finnis\nList II: a. Law as integrity and constructive interpretation  b. Internal morality of law (eight desiderata)  c. Sources thesis and service conception of authority  d. Basic goods and practical reasonableness","o":["A. I-b, II-a, III-c, IV-d","B. I-b, II-c, III-d, IV-a","C. I-b, II-c, III-a, IV-d","D. I-d, II-c, III-a, IV-b"],"a":2,"e":"Fuller - internal morality; Raz - sources thesis; Dworkin - law as integrity; Finnis - basic goods."},{"s":"Jurisprudence and Legal Theory","t":"Statement","d":"Difficult","q":"Consider the following about Kelsen's Pure Theory of Law:\n1. The Grundnorm is presupposed, not posited.\n2. The theory seeks to purge legal science of sociological, psychological and moral elements.\n3. The State and the legal order are identical.\n4. A norm derives its validity from its efficacy taken in isolation.\nWhich are correct?","o":["A. 1, 3 and 4 only","B. 1, 2 and 3 only","C. 2 and 4 only","D. 1, 2 and 4 only"],"a":1,"e":"Validity of a norm comes from a higher norm; efficacy is only a condition of validity of the system as a whole."},{"s":"Jurisprudence and Legal Theory","t":"Match","d":"Difficult","q":"Match the defects of a regime of primary rules (List I) with Hart's secondary-rule remedies (List II).\nList I: I. Uncertainty  II. Static character  III. Inefficiency of diffuse social pressure\nList II: a. Rule of change  b. Rule of adjudication  c. Rule of recognition","o":["A. I-a, II-b, III-c","B. I-c, II-a, III-b","C. I-b, II-a, III-c","D. I-c, II-b, III-a"],"a":1,"e":"Uncertainty - recognition; static - change; inefficiency - adjudication."},{"s":"Jurisprudence and Legal Theory","t":"Concept","d":"Difficult","q":"'Possession consists of corpus alone; animus is only the practical condition of control, and possession is protected to safeguard ownership.' This view is associated with:","o":["A. Savigny","B. Salmond","C. Ihering","D. Holland"],"a":2,"e":"Savigny required corpus plus animus domini; Ihering rejected the animus requirement."},{"s":"Jurisprudence and Legal Theory","t":"Case-based","d":"Difficult","q":"In which case did the Supreme Court hold that the Guru Granth Sahib is a juristic person?","o":["A. Yogendra Nath Naskar v. CIT","B. Pramatha Nath Mullick v. Pradyumna Kumar Mullick","C. Shiromani Gurdwara Parbandhak Committee v. Som Nath Dass","D. Mohd. Salim v. State of Uttarakhand"],"a":2,"e":"Som Nath Dass (2000). Naskar and Mullick concern idols; Salim is the Ganga-Yamuna HC case (stayed by SC)."},{"s":"Jurisprudence and Legal Theory","t":"Concept","d":"Difficult","q":"Which method of ascertaining ratio decidendi gives primacy to the material facts as treated by the judge, and the decision based on them?","o":["A. Goodhart's test","B. Salmond's test","C. Halsbury's test","D. Wambaugh's inversion test"],"a":0,"e":"Goodhart: ratio lies in material facts plus decision on them; Wambaugh's is the reversal test."},{"s":"Jurisprudence and Legal Theory","t":"Assertion-Reason","d":"Difficult","q":"Assertion (A): Jerome Frank is generally described as a 'fact-sceptic' rather than merely a 'rule-sceptic'.\nReason (R): He stressed the uncertainty of fact-finding by trial courts as the main source of unpredictability in law.\nChoose the correct option.","o":["A. Both A and R are true and R is the correct explanation of A","B. Both A and R are true but R is not the correct explanation of A","C. A is true but R is false","D. A is false but R is true"],"a":0,"e":"Frank's emphasis was on unpredictability of trial-court fact-finding."},{"s":"Jurisprudence and Legal Theory","t":"Statement","d":"Difficult","q":"According to Austin's Province of Jurisprudence Determined, which are 'positive morality' (laws improperly so called) and not positive law?\n1. International law\n2. Constitutional law\n3. Rules of a social club\n4. Subordinate legislation made under statutory authority","o":["A. 1 and 2 only","B. 1, 2 and 3 only","C. 2, 3 and 4 only","D. 1, 3 and 4 only"],"a":1,"e":"Subordinate legislation is law proper (sovereign's command by delegation)."},{"s":"Jurisprudence and Legal Theory","t":"Chronology","d":"Difficult","q":"Arrange the following in the order in which Henry Maine places them in the progress of law (Ancient Law):\n1. Legal fictions  2. Customary law  3. Legislation  4. Equity  5. Codes","o":["A. 2, 5, 1, 4, 3","B. 2, 1, 5, 4, 3","C. 5, 2, 1, 3, 4","D. 2, 5, 4, 1, 3"],"a":0,"e":"Customary law, then Codes, then the agencies of change: fictions, equity, legislation."},{"s":"Constitutional Law","t":"Statement","d":"Difficult","q":"Consider the following on the basic structure doctrine and the Ninth Schedule:\n1. In Waman Rao, laws placed in the Ninth Schedule before 24 April 1973 were held open to basic structure challenge.\n2. In I.R. Coelho, laws placed in the Ninth Schedule after 24 April 1973 are open to challenge on basic structure / Part III grounds.\n3. In Minerva Mills, clauses (4) and (5) inserted in Art. 368 by the 42nd Amendment were struck down.\n4. In Indira Nehru Gandhi v. Raj Narain, Art. 329A(4) was struck down.\nWhich are correct?","o":["A. 1, 2 and 3 only","B. 1, 2 and 4 only","C. 1, 3 and 4 only","D. 2, 3 and 4 only"],"a":3,"e":"Waman Rao fixed 24 April 1973 as the cut-off; pre-cut-off laws were NOT open to challenge."},{"s":"Constitutional Law","t":"Match","d":"Difficult","q":"Match the cases with the propositions.\nList I: I. State of Punjab v. Davinder Singh (2024)  II. Mineral Area Development Authority v. SAIL (2024)  III. Anoop Baranwal v. Union of India (2023)  IV. Supriyo v. Union of India (2023)\nList II: a. Interim committee mechanism for appointment of Election Commissioners  b. Royalty is not a tax; States may tax mineral rights/land  c. Sub-classification within Scheduled Castes is permissible  d. No fundamental right to marry; same-sex marriage not recognised","o":["A. I-c, II-a, III-b, IV-d","B. I-c, II-b, III-a, IV-d","C. I-b, II-c, III-a, IV-d","D. I-c, II-b, III-d, IV-a"],"a":1,"e":"Davinder Singh - sub-classification; MADA - royalty not tax; Baranwal - EC appointment panel; Supriyo - no right to marry."},{"s":"Constitutional Law","t":"Statement","d":"Difficult","q":"With reference to S.R. Bommai v. Union of India, consider:\n1. A Proclamation under Art. 356 is judicially reviewable on limited grounds such as mala fides or absence of relevant material.\n2. Secularism is part of the basic structure and its violation by a State Government can attract Art. 356.\n3. Once approved by both Houses of Parliament, the Proclamation is wholly immune from judicial review.\n4. Where the majority of the Ministry is in doubt, it should ordinarily be tested on the floor of the House.\nWhich are correct?","o":["A. 1, 2 and 4 only","B. 1, 3 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 3 only"],"a":0,"e":"Parliamentary approval does not oust judicial review; the Court can even restore a dismissed Government."},{"s":"Constitutional Law","t":"Chronology","d":"Difficult","q":"Arrange the following Constitutional Amendments in chronological order:\n1. 101st (GST)  2. 103rd (EWS reservation)  3. 97th (Co-operative societies)  4. 106th (Women's reservation)","o":["A. 3, 1, 4, 2","B. 1, 3, 2, 4","C. 3, 1, 2, 4","D. 3, 2, 1, 4"],"a":2,"e":"97th (2011), 101st (2016), 103rd (2019), 106th (2023)."},{"s":"Constitutional Law","t":"Concept","d":"Difficult","q":"Which of the following is NOT a ground of reasonable restriction under Art. 19(2) on freedom of speech and expression?","o":["A. Interests of the general public","B. Incitement to an offence","C. Friendly relations with foreign States","D. Contempt of court"],"a":0,"e":"'Interests of the general public' appears in Art. 19(5) and 19(6), not 19(2)."},{"s":"Constitutional Law","t":"Case-based","d":"Difficult","q":"In Sita Soren v. Union of India (2024), a seven-judge Bench overruled P.V. Narasimha Rao. Which best reflects the holding?","o":["A. Legislators enjoy absolute immunity for bribery connected with speech or vote under Arts. 105(2)/194(2)","B. Immunity extends to MPs for bribery but not to MLAs","C. Immunity is available only if the vote is actually cast as the bribe-giver desired","D. Immunity under Arts. 105(2)/194(2) does not extend to bribery, since the offence is complete on agreement/acceptance irrespective of the vote or speech actually given"],"a":3,"e":"The Court held bribery is not protected as it is not necessary to the functioning of the legislator."},{"s":"Constitutional Law","t":"Statement","d":"Difficult","q":"Which of the following subjects were transferred from the State List to the Concurrent List by the 42nd Amendment?\n1. Forests  2. Protection of wild animals and birds  3. Education  4. Agriculture","o":["A. 1 and 3 only","B. 1, 2 and 3 only","C. 2, 3 and 4 only","D. 1, 2, 3 and 4"],"a":1,"e":"Agriculture remains a State subject (Entry 14, List II)."},{"s":"Constitutional Law","t":"Concept","d":"Difficult","q":"Under Art. 200, in which situation is the Governor constitutionally bound to reserve a Bill for the President?","o":["A. The Bill relates to a Concurrent List subject","B. The Bill is a Money Bill passed by the Assembly","C. The Bill imposes restrictions on freedom of trade within the State","D. The Bill, if enacted, would derogate from the powers of the High Court so as to endanger its constitutional position"],"a":3,"e":"The second proviso to Art. 200 makes reservation compulsory in the High Court derogation case."},{"s":"Constitutional Law","t":"Case-based","d":"Difficult","q":"In which case did the Supreme Court hold that legislation can be struck down under Art. 14 for 'manifest arbitrariness', departing from the McDowell view?","o":["A. E.P. Royappa v. State of Tamil Nadu","B. State of A.P. v. McDowell & Co.","C. Ajay Hasia v. Khalid Mujib","D. Shayara Bano v. Union of India"],"a":3,"e":"Shayara Bano (2017) accepted manifest arbitrariness as a ground to invalidate legislation."},{"s":"Constitutional Law","t":"Statement","d":"Difficult","q":"In Kaushal Kishore v. State of U.P. (2023), the Constitution Bench held that:\n1. Grounds in Art. 19(2) are exhaustive; no additional restrictions can be imposed on speech of public functionaries.\n2. Fundamental rights under Arts. 19 and 21 can be enforced against persons other than the State.\n3. A Minister's statement made in official capacity can be vicariously attributed to the Government.\n4. The State has a positive duty to protect life and liberty even from private actors.\nWhich are correct?","o":["A. 2, 3 and 4 only","B. 1, 3 and 4 only","C. 1, 2 and 4 only","D. 1, 2 and 3 only"],"a":2,"e":"The majority refused to attribute a Minister's statement vicariously to the Government."},{"s":"Administrative Law","t":"Case-based","d":"Difficult","q":"In Dimes v. Proprietors of Grand Junction Canal (1852), the Lord Chancellor's decree was set aside because of:","o":["A. Prejudgment of the subject matter","B. Personal hostility towards a party","C. Departmental (institutional) bias","D. Pecuniary interest, disqualifying automatically without proof of actual bias"],"a":3,"e":"He held shares in the canal company; pecuniary interest disqualifies automatically."},{"s":"Administrative Law","t":"Concept","d":"Difficult","q":"In the GCHQ case (Council of Civil Service Unions v. Minister for the Civil Service), Lord Diplock's three heads of review were illegality, irrationality and procedural impropriety. Which was mentioned only as a possible future head?","o":["A. Illegality","B. Irrationality","C. Procedural impropriety","D. Proportionality"],"a":3,"e":"Proportionality was flagged as a possible future addition."},{"s":"Administrative Law","t":"Concept","d":"Difficult","q":"The 'Henry VIII clause' in delegated legislation refers to:","o":["A. A clause permitting unlimited sub-delegation","B. A clause requiring rules to be laid before the legislature","C. A clause empowering the delegate to amend or modify the parent Act itself, which courts treat as excessive if it alters essential features (Jalan Trading Co. case)","D. A clause barring judicial review of rules"],"a":2,"e":"Henry VIII/'removal of difficulties' clauses must not alter essential features of the Act."},{"s":"Administrative Law","t":"Statement","d":"Difficult","q":"Which are essential conditions for a writ of quo warranto?\n1. The office must be public.\n2. It must be created by statute or the Constitution.\n3. It must be substantive, not merely the employment of a servant at pleasure.\n4. The petitioner must be personally aggrieved by the appointment.","o":["A. 2, 3 and 4 only","B. 1, 2 and 4 only","C. 1, 2 and 3 only","D. 1, 3 and 4 only"],"a":2,"e":"Any person may move for quo warranto; personal grievance is not required (University of Mysore v. Govinda Rao)."},{"s":"Administrative Law","t":"Concept","d":"Difficult","q":"Under the Lokpal and Lokayuktas Act, 2013, the Lokpal consists of a Chairperson and not more than ___ members, of whom ___% shall be judicial members and not less than ___% from SC/ST/OBC/minorities/women.","o":["A. 8; 50; 50","B. 8; 33; 50","C. 10; 50; 33","D. 6; 50; 50"],"a":0,"e":"Maximum eight members; 50% judicial; 50% from reserved categories and women."},{"s":"Administrative Law","t":"Case-based","d":"Difficult","q":"In L. Chandra Kumar v. Union of India, the Supreme Court held that:","o":["A. Tribunals can test vires of statutory provisions and rules (except their parent statute); their decisions are subject to High Court scrutiny before a Division Bench under Arts. 226/227","B. Tribunals can test the vires of any statute including their own parent statute","C. Judicial review by High Courts can be wholly excluded by Art. 323A","D. Tribunal decisions lie directly to the Supreme Court only"],"a":0,"e":"Judicial review by HCs and SC is part of the basic structure; Art. 323A(2)(d) and 323B(3)(d) were struck down."},{"s":"Administrative Law","t":"Statement","d":"Difficult","q":"With reference to promissory estoppel against the State (Motilal Padampat Sugar Mills v. State of U.P.):\n1. It is an equitable doctrine that applies against the Government.\n2. The promisee need not show detriment; alteration of position suffices.\n3. Executive necessity is no defence, but overriding public interest may be.\n4. It can compel the Government to act contrary to a statute.\nWhich are correct?","o":["A. 1, 2 and 4 only","B. 1, 3 and 4 only","C. 2 and 4 only","D. 1, 2 and 3 only"],"a":3,"e":"There is no estoppel against statute, so 4 is wrong."},{"s":"Administrative Law","t":"Case-based","d":"Difficult","q":"In Re Special Reference No. 1 of 1998 (Third Judges Case), the collegium for recommending Supreme Court appointments was held to consist of the CJI and:","o":["A. Two senior-most Judges","B. Three senior-most Judges","C. Five senior-most Judges","D. Four senior-most Judges"],"a":3,"e":"CJI plus four senior-most puisne Judges for the Supreme Court."},{"s":"Administrative Law","t":"Statement","d":"Difficult","q":"Section 44(3) of the Digital Personal Data Protection Act, 2023 amended Section 8(1)(j) of the RTI Act, 2005. The amendment:","o":["A. Makes personal information disclosable whenever the Information Commission directs","B. Retains the earlier qualifiers and adds data fiduciary duties","C. Exempts only sensitive personal data such as health records","D. Exempts all 'information which relates to personal information', dropping the earlier qualifiers (nexus with public activity/interest, unwarranted invasion of privacy) and the proviso on information deniable to Parliament"],"a":3,"e":"The amendment widened the personal information exemption."},{"s":"Administrative Law","t":"Statement","d":"Difficult","q":"Consider State liability cases:\n1. Kasturilal v. State of U.P. - State immune for police seizure of gold as a sovereign function.\n2. State of Rajasthan v. Vidyawati - State vicariously liable for negligent driving of a Government jeep.\n3. N. Nagendra Rao v. State of A.P. - sovereign immunity confined to truly sovereign functions.\n4. Saheli v. Commissioner of Police - State not liable for custodial death as police act in sovereign capacity.\nWhich are correct?","o":["A. 1, 2 and 4 only","B. 1, 3 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 3 only"],"a":3,"e":"In Saheli the State was held liable and compensation awarded."},{"s":"Public International Law","t":"Statement","d":"Difficult","q":"Consider the Vienna Convention on the Law of Treaties, 1969:\n1. Art. 53: a treaty is void if it conflicts with a peremptory norm at the time of conclusion.\n2. Art. 64: a new peremptory norm terminates an existing treaty in conflict with it.\n3. Art. 62: fundamental change of circumstances may be invoked to terminate a treaty establishing a boundary.\n4. Art. 27: a party may not invoke its internal law to justify non-performance.\nWhich are correct?","o":["A. 1, 2 and 4 only","B. 1, 3 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 3 only"],"a":0,"e":"Art. 62(2)(a) bars the doctrine for boundary treaties."},{"s":"Public International Law","t":"Concept","d":"Difficult","q":"The doctrine of non-recognition of territorial changes brought about by force, in the context of Japan's invasion of Manchuria, is known as the:","o":["A. Estrada Doctrine","B. Stimson Doctrine","C. Tobar Doctrine","D. Hallstein Doctrine"],"a":1,"e":"Estrada/Tobar concern recognition of governments; Hallstein concerned West Germany."},{"s":"Public International Law","t":"Statement","d":"Difficult","q":"Under UNCLOS, consider:\n1. The contiguous zone extends up to 24 nautical miles from the baselines.\n2. The EEZ extends up to 200 nautical miles from the baselines.\n3. The continental shelf may extend beyond 200 nm, subject to a limit of 350 nm from baselines (or 100 nm from the 2,500 m isobath), per CLCS recommendations.\n4. Foreign ships have a right of innocent passage through internal waters in all cases.\nWhich are correct?","o":["A. 1 and 4 only","B. 1, 2 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 3 only"],"a":3,"e":"Innocent passage does not apply in internal waters (save enclosed straight-baseline waters)."},{"s":"Public International Law","t":"Match","d":"Difficult","q":"Match the ICJ cases with their principles.\nList I: I. Nottebohm  II. Barcelona Traction  III. LaGrand  IV. North Sea Continental Shelf\nList II: a. Obligations erga omnes  b. Genuine link for diplomatic protection  c. Binding nature of provisional measures  d. Opinio juris and State practice in custom formation","o":["A. I-b, II-a, III-c, IV-d","B. I-b, II-a, III-d, IV-c","C. I-a, II-b, III-c, IV-d","D. I-b, II-c, III-a, IV-d"],"a":0,"e":"Standard case-principle pairings."},{"s":"Public International Law","t":"Concept","d":"Difficult","q":"Which of the following is NOT an exception to a diplomatic agent's civil immunity under Art. 31(1) of the Vienna Convention on Diplomatic Relations, 1961?","o":["A. An action arising from a contract entered into on behalf of the sending State","B. An action relating to succession in which he is an executor in a private capacity","C. An action relating to professional or commercial activity outside his official functions","D. A real action relating to private immovable property in the receiving State"],"a":0,"e":"Contracts on behalf of the sending State fall within official functions."},{"s":"Public International Law","t":"Case-based","d":"Difficult","q":"In the Bosnia Genocide case (2007), the ICJ, for attributing conduct of Bosnian Serb forces to the FRY, applied:","o":["A. The overall control test of the Tadic Appeals Chamber","B. The effective control test (while rejecting overall control as a test for attribution)","C. A substantial contribution test","D. A test of mere financial support"],"a":1,"e":"The ICJ preferred effective control (Nicaragua) for attribution."},{"s":"Public International Law","t":"Concept","d":"Difficult","q":"Which of the following is NOT a ground of persecution under Art. 1A(2) of the 1951 Refugee Convention?","o":["A. Race","B. Generalised violence or armed conflict","C. Membership of a particular social group","D. Nationality"],"a":1,"e":"Generalised violence is covered only by regional instruments (OAU, Cartagena)."},{"s":"Public International Law","t":"Concept","d":"Difficult","q":"Which of the following is NOT among the crimes covered by the Responsibility to Protect under the 2005 World Summit Outcome Document?","o":["A. Crime of aggression","B. Genocide","C. Ethnic cleansing","D. Crimes against humanity"],"a":0,"e":"R2P covers genocide, war crimes, ethnic cleansing and crimes against humanity."},{"s":"Public International Law","t":"Concept","d":"Difficult","q":"Under Art. 16 of the Rome Statute, the UN Security Council (Chapter VII) may request deferral of an ICC investigation or prosecution for a period of:","o":["A. 6 months","B. 5 years","C. 24 months","D. 12 months, renewable on the same conditions"],"a":3,"e":"Art. 16 deferral is for 12 months and is renewable."},{"s":"Public International Law","t":"Case-based","d":"Difficult","q":"In Maganbhai Ishwarbhai Patel v. Union of India (1969), the Supreme Court held that:","o":["A. Any boundary alteration requires a law under Art. 3","B. Demarcation or settlement of an existing boundary can be done by executive action, but cession of Indian territory requires a constitutional amendment under Art. 368","C. All treaties require Parliamentary ratification under Art. 253","D. The executive may freely cede territory"],"a":1,"e":"Maganbhai followed Berubari on cession and distinguished mere demarcation."},{"s":"Human Rights","t":"Concept","d":"Difficult","q":"The UDHR was adopted by the UN General Assembly on 10 December 1948 with:","o":["A. Unanimity","B. 56 in favour, none against, 2 abstentions","C. 48 in favour, 8 against","D. 48 votes in favour, none against, 8 abstentions"],"a":3,"e":"The vote was 48-0-8."},{"s":"Human Rights","t":"Concept","d":"Difficult","q":"Which of the following ICCPR rights is non-derogable under Art. 4(2)?","o":["A. Art. 9 - liberty and security of the person","B. Art. 21 - peaceful assembly","C. Art. 17 - privacy","D. Art. 11 - no imprisonment merely for inability to fulfil a contractual obligation"],"a":3,"e":"Non-derogable: Arts. 6, 7, 8(1)-(2), 11, 15, 16 and 18."},{"s":"Human Rights","t":"Concept","d":"Difficult","q":"India has signed but NOT ratified which of the following?","o":["A. Convention on the Elimination of Racial Discrimination","B. CEDAW","C. Convention against Torture","D. Convention on the Rights of Persons with Disabilities"],"a":2,"e":"India signed CAT in 1997 but has not ratified it."},{"s":"Human Rights","t":"Concept","d":"Difficult","q":"After the Protection of Human Rights (Amendment) Act, 2019, the term of the NHRC Chairperson and Members is:","o":["A. Five years or 70 years","B. Three years or 70 years, whichever is earlier","C. Five years or 65 years","D. Three years or 65 years"],"a":1,"e":"The 2019 amendment reduced the term from five to three years."},{"s":"Human Rights","t":"Case-based","d":"Difficult","q":"In which case did the Supreme Court first award monetary compensation under Art. 32 for violation of Art. 21 by the State?","o":["A. Bhim Singh v. State of J&K","B. Rudul Sah v. State of Bihar","C. Nilabati Behera v. State of Orissa","D. D.K. Basu v. State of W.B."],"a":1,"e":"Rudul Sah (1983) is the pioneering compensation case."},{"s":"Human Rights","t":"Statement","d":"Difficult","q":"Under the Sexual Harassment of Women at Workplace Act, 2013:\n1. The Internal Committee must have at least four members, including an external member.\n2. A complaint is to be made within three months of the incident, extendable by another three months.\n3. Conciliation may result in a monetary settlement.\n4. An IC must be constituted at each office/branch with ten or more employees.\nWhich are correct?","o":["A. 1, 3 and 4 only","B. 1, 2 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 3 only"],"a":1,"e":"Section 10(1) bars monetary settlement as the basis of conciliation."},{"s":"Human Rights","t":"Case-based","d":"Difficult","q":"Which decision held that the RTE Act, 2009 does not apply to minority institutions, aided or unaided?","o":["A. T.M.A. Pai Foundation v. State of Karnataka","B. Society for Unaided Private Schools of Rajasthan v. Union of India","C. Unni Krishnan v. State of A.P.","D. Pramati Educational and Cultural Trust v. Union of India"],"a":3,"e":"Pramati (2014) upheld the 93rd Amendment's Art. 15(5) and exempted minority institutions."},{"s":"Human Rights","t":"Case-based","d":"Difficult","q":"In which case was mandatory death penalty for murder by a life convict (s.303 IPC) struck down?","o":["A. Bachan Singh v. State of Punjab","B. Jagmohan Singh v. State of U.P.","C. Mithu v. State of Punjab","D. Machhi Singh v. State of Punjab"],"a":2,"e":"Mithu (1983) held s.303 violated Arts. 14 and 21."},{"s":"Human Rights","t":"Statement","d":"Difficult","q":"Which of the following are correctly paired?\n1. Parmanand Katara v. UOI - duty to give immediate medical aid to accident victims\n2. Chameli Singh v. State of U.P. - right to shelter is part of Art. 21\n3. Mohini Jain v. State of Karnataka - right to education flows from the right to life\n4. Maneka Gandhi v. UOI - right to travel abroad is part of Art. 19(1)(a)","o":["A. 1, 2 and 4 only","B. 1, 3 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 3 only"],"a":3,"e":"Maneka Gandhi treated travel abroad as part of personal liberty under Art. 21."},{"s":"Human Rights","t":"Concept","d":"Difficult","q":"The UN Human Rights Council (est. 2006, GA Res. 60/251) consists of:","o":["A. 53 members, 3-year terms","B. 47 members, unlimited consecutive terms","C. 47 members, 4-year terms","D. 47 members, 3-year terms, ineligible for immediate re-election after two consecutive terms"],"a":3,"e":"The HRC replaced the Commission on Human Rights."},{"s":"Family Law","t":"Case-based","d":"Difficult","q":"In Shilpa Sailesh v. Varun Sreenivasan (2023), the Constitution Bench held that:","o":["A. Irretrievable breakdown is a statutory ground of divorce under s.13 HMA","B. The Supreme Court may under Art. 142 dissolve a marriage on irretrievable breakdown and waive the s.13B(2) period, though it is not a ground under the HMA","C. Family Courts may dissolve marriages on irretrievable breakdown","D. Art. 142 cannot be used to waive the s.13B(2) waiting period"],"a":1,"e":"The power is discretionary and not available as of right."},{"s":"Family Law","t":"Case-based","d":"Difficult","q":"In Revanasiddappa v. Mallikarjun (2023), the Supreme Court held that children of void/voidable marriages:","o":["A. Are coparceners by birth in the joint family","B. Are entitled only to their parent's share in joint family property (and self-acquired property), not to shares of other coparceners","C. Are entitled only to self-acquired property of the parents","D. Have no property rights"],"a":1,"e":"Section 16(3) HMA operates with this limit."},{"s":"Family Law","t":"Case-based","d":"Difficult","q":"Under the 2005 amendment to s.6 of the Hindu Succession Act, as interpreted in Vineeta Sharma v. Rakesh Sharma (2020):","o":["A. Daughter's coparcenary right depends on the father being alive on 9 September 2005","B. Daughters become coparceners only on partition","C. Rights apply only to daughters born after 9 September 2005","D. A daughter is a coparcener by birth with the same rights as a son; the father need not have been alive on 9 September 2005; oral partition is not accepted unless backed by public documents or a court decree"],"a":3,"e":"Vineeta Sharma resolved the conflict between Prakash v. Phulavati and Danamma."},{"s":"Family Law","t":"Statement","d":"Difficult","q":"Under the Muslim Women (Protection of Rights on Marriage) Act, 2019:\n1. Talaq-e-biddat is voidable at the wife's option.\n2. The punishment is imprisonment up to three years and fine.\n3. The offence is cognizable only on information from the married woman or a person related to her by blood or marriage.\n4. The Magistrate may grant bail only after hearing the married woman.\nWhich are correct?","o":["A. 1, 2 and 3 only","B. 2, 3 and 4 only","C. 1, 3 and 4 only","D. 1, 2 and 4 only"],"a":1,"e":"The Act declares such talaq void and illegal, not voidable."},{"s":"Family Law","t":"Match","d":"Difficult","q":"Match the terms with their meanings.\nList I: I. Lian  II. Ila  III. Zihar  IV. Khula\nList II: a. Husband's false charge of adultery followed by oaths  b. Husband's vow to abstain from intercourse for four months  c. Husband likens wife to a woman within prohibited degrees  d. Divorce at wife's instance for consideration","o":["A. I-a, II-c, III-b, IV-d","B. I-b, II-a, III-c, IV-d","C. I-a, II-b, III-c, IV-d","D. I-a, II-b, III-d, IV-c"],"a":2,"e":"Standard definitions of the four forms."},{"s":"Family Law","t":"Case-based","d":"Difficult","q":"In Mohd. Abdul Samad v. State of Telangana (2024), the Supreme Court held that:","o":["A. A divorced Muslim woman may claim maintenance under s.125 CrPC (now s.144 BNSS) in addition to remedies under the 1986 Act","B. She may claim only under the 1986 Act","C. Maintenance is payable only during iddat","D. s.125 CrPC does not apply to Muslims"],"a":0,"e":"Section 125 is a secular provision available to all women."},{"s":"Family Law","t":"Assertion-Reason","d":"Difficult","q":"Assertion (A): In Githa Hariharan v. RBI, the Supreme Court read the word 'after' in s.6(a) of the Hindu Minority and Guardianship Act as 'in the absence of'.\nReason (R): The Court struck down s.6(a) as violative of Art. 14.\nChoose the correct option.","o":["A. Both A and R are true and R is the correct explanation of A","B. Both A and R are true but R is not the correct explanation of A","C. A is true but R is false","D. A is false but R is true"],"a":2,"e":"The Court read down the provision; it did not strike it down."},{"s":"Family Law","t":"Statement","d":"Difficult","q":"Under the Hindu Adoptions and Maintenance Act, 1956, for a valid adoption:\n1. The adoptee must be a Hindu.\n2. The adoptee must not be married unless custom permits.\n3. The adoptee must not have completed 15 years unless custom permits.\n4. Only a male child may be adopted.\nWhich are correct?","o":["A. 1, 3 and 4 only","B. 1, 2 and 3 only","C. 2, 3 and 4 only","D. 1, 2 and 4 only"],"a":1,"e":"A daughter may also be adopted."},{"s":"Family Law","t":"Statement","d":"Difficult","q":"Under s.125 CrPC (s.144 BNSS), maintenance may be claimed by:\n1. A wife unable to maintain herself\n2. A minor child (legitimate or illegitimate) unable to maintain itself\n3. A major child (not a married daughter) with a physical or mental abnormality or injury\n4. A major married daughter unable to maintain herself","o":["A. 1, 2 and 3 only","B. 1, 3 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 4 only"],"a":0,"e":"A major married daughter is excluded unless within the minor/abnormality categories."},{"s":"Family Law","t":"Concept","d":"Difficult","q":"A Hindu man marries a Christian woman under the Special Marriage Act, 1954. Succession to his property is governed by:","o":["A. Hindu Succession Act, 1956","B. His personal law","C. Indian Succession Act, 1925","D. Her personal law"],"a":2,"e":"Section 21 SMA sends such marriages to the Indian Succession Act, except where the spouses are Hindu, Buddhist, Sikh or Jain."},{"s":"Contract, Torts and Consumer Protection","t":"Concept","d":"Difficult","q":"Under s.4 of the Indian Contract Act, 1872, communication of acceptance is complete:","o":["A. As against the proposer when it comes to his knowledge; as against the acceptor when put in transmission","B. As against the proposer when put in course of transmission to him; as against the acceptor when it comes to the knowledge of the proposer","C. Both when it comes to the knowledge of the proposer","D. Both when put in course of transmission"],"a":1,"e":"This is the postal rule as codified."},{"s":"Contract, Torts and Consumer Protection","t":"Statement","d":"Difficult","q":"Under Indian law of contract:\n1. Consideration may be past, if rendered at the promisor's desire.\n2. Consideration may move from the promisee or any other person.\n3. Consideration need not be adequate.\n4. Consideration must have measurable market value.\nWhich are correct?","o":["A. 1, 2 and 3 only","B. 1, 3 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 4 only"],"a":0,"e":"Section 2(d) and Explanation 2 to s.25 reject adequacy and market value tests."},{"s":"Contract, Torts and Consumer Protection","t":"Statement","d":"Difficult","q":"Which statement about s.27 ICA (restraint of trade) is INCORRECT?","o":["A. Reasonableness of restraint is irrelevant under s.27, save for statutory exceptions","B. A negative covenant operating during the contract term is not hit by s.27 (Niranjan Shankar Golikari)","C. A post-termination covenant restraining an ex-employee from joining a competitor is valid if reasonable","D. The sale-of-goodwill exception permits reasonable restraint within specified local limits"],"a":2,"e":"Post-termination restraints are void under s.27 (Percept D'Mark)."},{"s":"Contract, Torts and Consumer Protection","t":"Case-based","d":"Difficult","q":"In Satyabrata Ghose v. Mugneeram Bangur (1954), the Supreme Court held that:","o":["A. Frustration is an English common-law doctrine distinct from s.56","B. s.56 applies only to physical impossibility","C. s.56 is exhaustive on frustration; 'impossible' includes practical impossibility and loss of the contract's object, and there is no resort to English doctrine outside it","D. Commercial hardship from price rise is frustration"],"a":2,"e":"This is the leading case on s.56; Energy Watchdog later held that mere onerousness is not frustration."},{"s":"Contract, Torts and Consumer Protection","t":"Concept","d":"Difficult","q":"Chapter IIA of the Specific Relief Act (inserted 2018) on infrastructure project contracts requires suits to be disposed of within:","o":["A. 6 months, extendable by 3 months","B. 18 months without extension","C. 12 months, extendable by 12 months","D. 12 months from service of summons, extendable by up to 6 months in aggregate"],"a":3,"e":"Section 20C; s.20A bars injunctions that impede infrastructure projects."},{"s":"Contract, Torts and Consumer Protection","t":"Case-based","d":"Difficult","q":"In M.C. Mehta v. Union of India (Oleum Gas Leak, 1987), the Supreme Court:","o":["A. Applied Rylands v. Fletcher with all its exceptions","B. Held liability only for negligence","C. Held liability arises only for non-natural user","D. Evolved absolute liability for hazardous enterprises, without exceptions like act of God or stranger, with compensation correlated to the enterprise's magnitude and capacity"],"a":3,"e":"The Court declined to follow the Rylands exceptions."},{"s":"Contract, Torts and Consumer Protection","t":"Case-based","d":"Difficult","q":"The 'last opportunity' rule in contributory negligence originated in:","o":["A. Butterfield v. Forrester","B. Nance v. British Columbia Electric Railway","C. Rural Transport Service v. Bezlum Bibi","D. Davies v. Mann"],"a":3,"e":"Davies v. Mann (the donkey case)."},{"s":"Contract, Torts and Consumer Protection","t":"Concept","d":"Difficult","q":"Under the Consumer Protection (Jurisdiction) Rules, 2021, based on consideration paid, the pecuniary jurisdiction is:","o":["A. District up to Rs 1 crore; State Rs 1-10 crore; National above Rs 10 crore","B. District up to Rs 50 lakh; State Rs 50 lakh-Rs 2 crore; National above Rs 2 crore","C. District up to Rs 20 lakh; State Rs 20 lakh-Rs 1 crore; National above Rs 1 crore","D. District up to Rs 50 lakh; State Rs 50 lakh-Rs 5 crore; National above Rs 5 crore"],"a":1,"e":"Option A is the 2019 Act's original scheme; option C is the 1986 Act amended scheme."},{"s":"Contract, Torts and Consumer Protection","t":"Concept","d":"Difficult","q":"Under s.21 of the Consumer Protection Act, 2019, the CCPA may penalise a manufacturer/endorser for misleading advertisements up to Rs 10 lakh (Rs 50 lakh for subsequent contravention) and may prohibit the endorser for:","o":["A. Up to one year; up to three years for subsequent contravention","B. Up to six months; up to one year for subsequent contravention","C. Up to two years; up to five years for subsequent contravention","D. Up to three years; up to five years for subsequent contravention"],"a":0,"e":"Prohibition on endorsement: one year, then three years."},{"s":"Contract, Torts and Consumer Protection","t":"Case-based","d":"Difficult","q":"Which decision held that criminal liability of medical professionals requires gross negligence or recklessness and laid down safeguards before prosecution?","o":["A. Jacob Mathew v. State of Punjab","B. Bolam v. Friern Hospital Management Committee","C. Indian Medical Association v. V.P. Shantha","D. Samira Kohli v. Prabha Manchanda"],"a":0,"e":"Jacob Mathew (2005) requires a credible medical opinion before prosecution."},{"s":"Commercial Law","t":"Case-based","d":"Difficult","q":"In Prest v. Petrodel Resources Ltd (UKSC, 2013), the veil of incorporation may be pierced:","o":["A. Whenever the company is a sham","B. Only where a person under an existing legal obligation or restriction deliberately evades or frustrates its enforcement by interposing a company under his control (evasion principle); mere concealment is not piercing","C. Whenever justice requires","D. Whenever the company is a mere facade"],"a":1,"e":"Prest confined veil piercing to evasion."},{"s":"Commercial Law","t":"Concept","d":"Difficult","q":"Under s.244 of the Companies Act, 2013, members of a company having share capital may apply to the NCLT for oppression and mismanagement relief if they are:","o":["A. Not less than 100 members or one-tenth of members, whichever is less, or holders of one-tenth of issued share capital","B. Not less than 100 members or one-tenth of members, whichever is more","C. Holders of 25% of share capital","D. At least 10% of members regardless of number"],"a":0,"e":"NCLT may waive these requirements under the proviso."},{"s":"Commercial Law","t":"Case-based","d":"Difficult","q":"In Mobilox Innovations v. Kirusa Software (2017), an operational creditor's s.9 IBC application is to be rejected if:","o":["A. There is a plausible, genuine pre-existing dispute that is not a patently feeble legal argument or a bald factual assertion unsupported by evidence","B. Any dispute is raised at any stage","C. The corporate debtor shows ability to pay","D. The creditor has other remedies"],"a":0,"e":"Mobilox test: pre-existing dispute and plausible contention requiring investigation."},{"s":"Commercial Law","t":"Concept","d":"Difficult","q":"After the Negotiable Instruments (Amendment) Act, 2015 (overriding Dasrath Rupsingh Rathod), territorial jurisdiction for s.138 where the cheque is delivered for collection through an account lies with the court:","o":["A. Where the drawee (drawer's) bank is located","B. Where the cheque was issued","C. Within whose limits the branch of the bank where the payee/holder in due course maintains the account is situated","D. Where the drawer resides"],"a":2,"e":"Section 142(2)(a) NI Act as inserted in 2015."},{"s":"Commercial Law","t":"Concept","d":"Difficult","q":"Under s.11 of the Sale of Goods Act, 1930, unless a different intention appears:","o":["A. Time of payment is deemed of the essence","B. Time is always of the essence","C. Stipulations as to time of payment are not deemed essence; whether other time stipulations are essence depends on the contract","D. Time of delivery is never of the essence"],"a":2,"e":"Section 11(1) SOGA."},{"s":"Commercial Law","t":"Concept","d":"Difficult","q":"Which proceeding is NOT barred by s.69 of the Indian Partnership Act, 1932 despite non-registration of the firm?","o":["A. A suit by the firm against a third party to enforce a contractual right","B. A suit by a partner against the firm to enforce a contractual right","C. A suit for dissolution of the firm or for accounts of a dissolved firm","D. A set-off claim exceeding Rs 100 in a suit by a third party"],"a":2,"e":"Section 69(3)(a) saves suits for dissolution and accounts."},{"s":"Commercial Law","t":"Statement","d":"Difficult","q":"Regarding Limited Liability Partnerships:\n1. An LLP is a body corporate with separate legal personality.\n2. A partner is not liable for the independent acts of other partners.\n3. An LLP has perpetual succession.\n4. An LLP may have a maximum of 20 partners.\nWhich are correct?","o":["A. 2, 3 and 4 only","B. 1, 3 and 4 only","C. 1, 2 and 3 only","D. 1, 2 and 4 only"],"a":2,"e":"An LLP has no maximum number of partners."},{"s":"Commercial Law","t":"Case-based","d":"Difficult","q":"In In Re: Interplay between Arbitration Agreements and the Stamp Act (2023, seven-judge Bench), the Supreme Court held that:","o":["A. Unstamped arbitration agreements are void and must be impounded at the s.11 stage","B. Unstamped agreements are inadmissible but not void; the defect is curable and does not bar appointment of arbitrator under s.11; N.N. Global (2023) was overruled","C. Stamp duty is a ground under s.34","D. Stamp duty is irrelevant to admissibility"],"a":1,"e":"The Court overruled N.N. Global and SMS Tea Estates."},{"s":"Commercial Law","t":"Concept","d":"Difficult","q":"Under s.29A of the Arbitration and Conciliation Act, 1996 (as amended in 2019), a domestic arbitral award must be made within:","o":["A. 12 months of appointment of the arbitrator","B. 12 months from completion of pleadings under s.23(4), extendable by parties by up to 6 months, and thereafter only by Court","C. 18 months from appointment plus 6 months","D. 6 months from completion of pleadings"],"a":1,"e":"International commercial arbitrations are only subject to an endeavour to decide within 12 months."},{"s":"Commercial Law","t":"Concept","d":"Difficult","q":"The Competition (Amendment) Act, 2023 introduced a deal value threshold: a transaction must be notified to CCI if its value exceeds:","o":["A. Rs 2,000 crore, with substantial business operations in India","B. Rs 1,000 crore","C. Rs 3,000 crore","D. Rs 5,000 crore"],"a":0,"e":"The deal value threshold is Rs 2,000 crore."},{"s":"Criminal Law, Procedure and Evidence","t":"Concept","d":"Difficult","q":"Under s.103(2) of the Bharatiya Nyaya Sanhita, 2023, murder by a group of ___ or more persons acting in concert on grounds of race, caste, community, sex, place of birth, language or personal belief is punishable with death or life imprisonment and fine.","o":["A. Five","B. Four","C. Three","D. Seven"],"a":0,"e":"Mob lynching provision requires five or more persons."},{"s":"Criminal Law, Procedure and Evidence","t":"Concept","d":"Difficult","q":"Section 152 of the BNS (acts endangering sovereignty, unity and integrity of India), which replaced sedition (s.124A IPC), prescribes:","o":["A. Imprisonment up to 3 years","B. Imprisonment up to 10 years only","C. Imprisonment for life or up to seven years, and fine","D. Death or life imprisonment"],"a":2,"e":"In S.G. Vombatkere (2022) the Supreme Court had kept s.124A in abeyance."},{"s":"Criminal Law, Procedure and Evidence","t":"Concept","d":"Difficult","q":"Under s.111 BNS (organised crime), 'continuing unlawful activity' means an offence punishable with imprisonment of ___ or more, by a member of a crime syndicate, in respect of which more than one charge-sheet has been filed within the preceding ___ years and cognizance taken.","o":["A. Seven years; ten years","B. Five years; five years","C. Three years; ten years","D. Three years; five years"],"a":2,"e":"This is the BNS definition."},{"s":"Criminal Law, Procedure and Evidence","t":"Concept","d":"Difficult","q":"Which BNS offence prescribes community service as a punishment?","o":["A. Criminal intimidation under s.351(2)","B. Cheating under s.318(2)","C. Theft of property worth less than Rs 5,000 by a first-time convict who restores the property","D. Causing death by rash driving"],"a":2,"e":"Section 303(2) prescribes community service in that case."},{"s":"Criminal Law, Procedure and Evidence","t":"Case-based","d":"Difficult","q":"A, a farmer, sees B stealing sacks of wheat from his open field at night and shoots B dead to stop the theft. Under the BNS:","o":["A. A exceeded the right of private defence of property (which does not extend to causing death in theft); if he acted in good faith without premeditation, it is culpable homicide not amounting to murder (Exception 2 to s.101)","B. A is guilty of murder because killing in theft is never excusable","C. A is fully protected by private defence","D. A is guilty only of death by negligence under s.106"],"a":0,"e":"The right of private defence of property in theft extends only to causing harm other than death."},{"s":"Criminal Law, Procedure and Evidence","t":"Concept","d":"Difficult","q":"Under s.187 BNSS, police custody of up to 15 days during investigation may be authorised:","o":["A. Only within the first 15 days of detention","B. At any time during the entire investigation","C. In whole or in parts at any time during the first 40 days or 60 days of the 60-day or 90-day detention period respectively","D. Up to 7 days only"],"a":2,"e":"BNSS permits police custody in parts within the first 40/60 days."},{"s":"Criminal Law, Procedure and Evidence","t":"Concept","d":"Difficult","q":"Under s.479 BNSS, a first-time offender who has undergone detention for up to ___ of the maximum sentence is entitled to release on bail (excluding offences punishable with death or life imprisonment).","o":["A. One-third","B. One-fourth","C. One-half","D. Two-thirds"],"a":0,"e":"Other undertrials qualify after one-half."},{"s":"Criminal Law, Procedure and Evidence","t":"Concept","d":"Difficult","q":"Under s.63 of the Bharatiya Sakshya Adhiniyam, 2023, the certificate for admissibility of electronic records must be signed by:","o":["A. The person in charge of the computer or device alone","B. Any witness","C. Only a government forensic expert","D. The person in charge of the computer/communication device or management of the activities, and an expert"],"a":3,"e":"The certificate is in the Schedule with Parts A and B."},{"s":"Criminal Law, Procedure and Evidence","t":"Statement","d":"Difficult","q":"In Pulukuri Kottaya v. Emperor, interpreting s.27 of the Evidence Act (now the proviso to s.23(2) BSA), which are correct?\n1. 'Fact discovered' includes the place from which an object is produced and the accused's knowledge of it.\n2. Only so much of the information as relates distinctly to the fact discovered is admissible.\n3. The information is admissible only if given when the accused was not in police custody.\n4. It operates as a proviso to the bar on confessions to police.","o":["A. 2, 3 and 4 only","B. 1, 3 and 4 only","C. 1, 2 and 4 only","D. 1, 2 and 3 only"],"a":2,"e":"Section 27 applies precisely to information given by an accused in police custody."},{"s":"Criminal Law, Procedure and Evidence","t":"Case-based","d":"Difficult","q":"The principle that a person who merely stood guard while others committed the crime is liable under common intention - 'they also serve who only stand and wait' - is from:","o":["A. Mahbub Shah v. King-Emperor","B. Virsa Singh v. State of Punjab","C. Barendra Kumar Ghosh v. King Emperor","D. Pandurang v. State of Hyderabad"],"a":2,"e":"Barendra Kumar Ghosh (Privy Council) on s.34 IPC (now s.3(5) BNS)."},{"s":"Environmental, IPR and Labour Law","t":"Match","d":"Difficult","q":"Match the principle with the case.\nList I: I. Polluter pays  II. Precautionary principle  III. Public trust doctrine  IV. Absolute liability\nList II: a. M.C. Mehta v. Kamal Nath  b. Indian Council for Enviro-Legal Action v. UOI  c. Vellore Citizens' Welfare Forum v. UOI  d. M.C. Mehta v. UOI (Oleum Gas Leak)","o":["A. I-c, II-b, III-a, IV-d","B. I-b, II-c, III-a, IV-d","C. I-b, II-a, III-c, IV-d","D. I-a, II-c, III-b, IV-d"],"a":1,"e":"Standard pairings."},{"s":"Environmental, IPR and Labour Law","t":"Statement","d":"Difficult","q":"The NGT has jurisdiction over substantial environmental questions under which of the following listed in Schedule I of the NGT Act, 2010?\n1. Wildlife (Protection) Act, 1972\n2. Biological Diversity Act, 2002\n3. Forest (Conservation) Act, 1980 (now Van (Sanrakshan Evam Samvardhan) Adhiniyam)\n4. Indian Forest Act, 1927","o":["A. 1 and 2 only","B. 2 and 3 only","C. 3 and 4 only","D. 1, 2 and 3 only"],"a":1,"e":"The Wildlife Protection Act and Indian Forest Act are outside Schedule I."},{"s":"Environmental, IPR and Labour Law","t":"Case-based","d":"Difficult","q":"In M.K. Ranjitsinh v. Union of India (2024), the Supreme Court recognised:","o":["A. The right to development under Art. 21A","B. Climate change as a ground under Art. 19(1)(g)","C. The right to a clean environment only as a Directive Principle","D. A right to be free from the adverse effects of climate change as part of Arts. 14 and 21"],"a":3,"e":"The Great Indian Bustard case."},{"s":"Environmental, IPR and Labour Law","t":"Statement","d":"Difficult","q":"Under the Biological Diversity Act, 2002, prior approval of the NBA is required for:\n1. Foreigners obtaining biological resources from India\n2. Transfer of research results to foreign nationals\n3. Applying for IPR anywhere based on research on Indian biological resources\n4. Indian citizens obtaining biological resources for commercial utilisation","o":["A. 1, 3 and 4 only","B. 1, 2 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 3 only"],"a":3,"e":"Indian citizens need only prior intimation to the State Biodiversity Board."},{"s":"Environmental, IPR and Labour Law","t":"Statement","d":"Difficult","q":"Which are correctly paired?\n1. Novartis AG v. UOI - s.3(d) and enhanced therapeutic efficacy\n2. Natco Pharma v. Bayer - first compulsory licence under s.84\n3. Dimminaco AG v. Controller of Patents - a product containing a living micro-organism (vaccine) held patentable\n4. F. Hoffmann-La Roche v. Cipla - s.3(d) held inapplicable by the Supreme Court","o":["A. 1, 2 and 3 only","B. 1, 3 and 4 only","C. 2, 3 and 4 only","D. 1, 2 and 4 only"],"a":0,"e":"Roche v. Cipla was a Delhi High Court injunction/public interest case."},{"s":"Environmental, IPR and Labour Law","t":"Case-based","d":"Difficult","q":"Which standard of originality for literary works did the Supreme Court adopt in Eastern Book Co. v. D.B. Modak (2008)?","o":["A. Modicum of creativity","B. Sweat of the brow","C. Novelty and inventive step","D. Mere skill and labour"],"a":0,"e":"A middle path between sweat of the brow and Feist."},{"s":"Environmental, IPR and Labour Law","t":"Case-based","d":"Difficult","q":"In Toyota Jidosha Kabushiki Kaisha v. Prius Auto Industries (2018), the Supreme Court held that in passing off:","o":["A. Global reputation alone suffices (universality)","B. The territoriality principle applies; trans-border reputation must be shown to have spilled over into India","C. Foreign registration confers rights in India","D. Well-known status is automatic"],"a":1,"e":"The Court affirmed territoriality in trade mark law."},{"s":"Environmental, IPR and Labour Law","t":"Statement","d":"Difficult","q":"With reference to Bangalore Water Supply v. A. Rajappa:\n1. The triple test: systematic activity, organised by cooperation between employer and employee, for production/distribution of goods and services to satisfy human wants.\n2. Profit motive or philanthropy is irrelevant.\n3. Strictly sovereign functions are outside 'industry'.\n4. Hospitals and educational institutions can never be 'industry'.\nWhich are correct?","o":["A. 2, 3 and 4 only","B. 1, 3 and 4 only","C. 1, 2 and 3 only","D. 1, 2 and 4 only"],"a":2,"e":"Hospitals and educational institutions may fall within 'industry'."},{"s":"Environmental, IPR and Labour Law","t":"Concept","d":"Difficult","q":"Under the Maternity Benefit (Amendment) Act, 2017, maternity leave for a woman with two or more surviving children, and for a commissioning/adopting mother of a child below three months, respectively, is:","o":["A. 26 weeks; 12 weeks","B. 12 weeks; 12 weeks","C. 12 weeks; 26 weeks","D. 8 weeks; 12 weeks"],"a":1,"e":"26 weeks applies to the first two children only."},{"s":"Environmental, IPR and Labour Law","t":"Case-based","d":"Difficult","q":"In State Bank of India v. N. Sundara Money (1976), the Supreme Court interpreted 'retrenchment' in s.2(oo) of the Industrial Disputes Act to mean:","o":["A. Termination of a workman's service by the employer for any reason whatsoever, except those expressly excluded (punishment, voluntary retirement, superannuation, non-renewal of fixed-term contract, ill-health)","B. Only termination for surplus labour","C. Only mass termination","D. Only closure"],"a":0,"e":"A wide interpretation covering termination simpliciter."}]};</script><script src="mock-test-engine.js"></script><script src="theme.js"></script><script src="accessibility.js"></script></body></html>
