 forming part of basic structure are abrogated.","concept_note":null},{"q_no":104,"topic":"Fundamental Rights","question":"Article 32(4) provides that the right under Article 32 shall NOT be suspended except as otherwise provided by the Constitution. This means:","options":{"A":"Art. 32 can be suspended only under Art. 359 (National Emergency Presidential Order) — and even then only if Arts. 20 & 21 are not involved","B":"Art. 32 can be suspended by Parliament anytime","C":"Art. 32 can be suspended by the Supreme Court","D":"Art. 32 cannot be suspended under any circumstances whatsoever"},"correct":"A","answer_text":"Art. 32 suspendable only under Art. 359 Presidential Order during Emergency — and NOT if Arts. 20 & 21 involved","explanation":"Article 32(4) provides that the right under Article 32 cannot be suspended except as otherwise provided by the Constitution. The only provision that allows suspension is Article 359 (Presidential Order during National Emergency). But even then, Arts. 20 and 21 cannot be suspended, so the right to enforce them under Art. 32 remains.","concept_note":null},{"q_no":105,"topic":"Fundamental Rights","question":"In Sita Soren v. Union of India (2024), the Supreme Court's 7-judge bench overruled P.V. Narasimha Rao v. State (1998) and held:","options":{"A":"MPs who take bribes to vote are protected under Article 105(2)","B":"MPs who take bribes to vote have NO immunity under Article 105 — bribery is not protected by parliamentary privilege","C":"All parliamentary activities are absolutely protected","D":"Members of State Legislatures are also protected from bribery charges"},"correct":"B","answer_text":"MPs who take bribes to vote have NO immunity — bribery is not protected by parliamentary privilege","explanation":"Sita Soren v. Union of India (2024) — a 7-judge constitutional bench unanimously overruled P.V. Narasimha Rao v. State (1998) and held that the immunity under Article 105(2) does not extend to bribery. A Member of Parliament who takes a bribe to vote in a particular manner cannot claim the protection of parliamentary privilege.","concept_note":null}]}]};

const pg=NLNav.pager({rangeHost:$('rg'),pagination:false,onChange:()=>{useRange();draw()}}),pp=NLNav.practice($('pp'));NLNav.daily($('dg'));

const x=pool[i],a=A[x.id],done=pool.filter(p=>A[p.id]).length,right=pool.filter(p=>A[p.id]===p.correct).length,R=pg.get().rs;pp.set(done,pool.length,'Questions '+(R+1)+'–'+pg.get().re);
const opts=Object.entries(x.options).map(([k,v])=>{let c='';if(a){if(k===x.correct)c=' ok';else if(k===a)c=' bad'}return`<button class="o${c}" data-k="${k}" ${a?'disabled':''}><b>${k}.</b><span>${esc(v)}</span></button>`}).join('');
const ex=a?`<div class="ex"><p><b>${a===x.correct?'✓ Correct.':'✗ Incorrect.'} Answer: ${x.correct}. ${esc(x.answer_text)}</b></p><p>${esc(x.explanation)}</p></div>${x.concept_note?`<div class="ex n"><p><b>Concept note</b></p><p>${esc(x.concept_note)}</p></div>`:''}`:'';
app.innerHTML=`<section class="c"><p class="m">Set ${x.set} · Q${x.q_no} · ${esc(x.topic)} — ${R+i+1} of ${full.length}</p><p class="q">${esc(x.question)}</p>${opts}<div id="ex" aria-live="polite">${ex}</div>
<div class="nav"><button class="b" id="pv" ${i?'':'disabled'}>← Previous</button><button class="b p sp" id="nx" ${i<pool.length-1?'':'disabled'}>Next →</button></div></section>
<aside class="c pal"><h3>Question palette</h3><div class="pg">${pool.map((p,j)=>`<button class="n${A[p.id]?(A[p.id]===p.correct?' ok':' bad'):''}${j===i?' cur':''}" data-j="${j}" aria-label="Question ${R+j+1}">${R+j+1}</button>`).join('')}</div><p class="sc">Answered ${done}/${pool.length} · Correct ${right}${done?` · ${Math.round(right/done*100)}%`:''}</p></aside>`}

if(o){const first=!A[pool[i].id];A[pool[i].id]=o.dataset.k;save();if(first)NLNav.prog.touch('u2:'+pool[i].id);draw();$('ex').scrollIntoView({block:'nearest'})}
else if(n){i=+n.dataset.j;draw()}
else if(e.target.id==='pv'){i--;draw()}else if(e.target.id==='nx'){i++;draw();scrollTo(0,0)}});
$('fs').onchange=$('ft').onchange=filt;
$('rs').onclick=()=>{if(confirm('Reset all progress for this module?')){A={};save();draw()}};
filt();
