<script>
const D={"sets":[{"set_id":1,"set_title":"First MCQ Bank - Full Syllabus Coverage","questions":[{"q_no":1,"topic":"Preamble","question":"The word 'SOCIALIST' was inserted into the Preamble of the Indian Constitution by which Amendment?","options":{"A":"44th Amendment","B":"42nd Amendment","C":"43rd Amendment","D":"46th Amendment"},"correct":"B","answer_text":"42nd Amendment","explanation":"The 42nd Amendment (1976) inserted 'Socialist', 'Secular', and 'Integrity' into the Preamble.","concept_note":null},{"q_no":2,"topic":"Preamble","question":"The Preamble of the Indian Constitution declares India to be a:","options":{"A":"Federal Democratic Republic","B":"Sovereign Socialist Secular Democratic Republic","C":"Sovereign Secular Federal Republic","D":"Unitary Socialist Republic"},"correct":"B","answer_text":"Sovereign Socialist Secular Democratic Republic","explanation":"The Preamble reads: 'We, the people of India, having solemnly resolved to constitute India into a Sovereign Socialist Secular Democratic Republic...'","concept_note":null},{"q_no":3,"topic":"Preamble","question":"In which landmark case did the Supreme Court hold that the Preamble is a part of the Constitution and can be used to interpret its provisions?","options":{"A":"Berubari Union Case","B":"Kesavananda Bharati v. State of Kerala","C":"Golaknath v. State of Punjab","D":"Minerva Mills v. Union of India"},"correct":"B","answer_text":"Kesavananda Bharati v. State of Kerala","explanation":"In Kesavananda Bharati (1973), the Supreme Court by a 7:6 majority held that the Preamble is a part of the Constitution. Earlier in Berubari Case (1960), the SC held the Preamble was not part of the Constitution.","concept_note":"Basic Structure Doctrine: In Kesavananda Bharati (1973), the Supreme Court held that Parliament can amend any part of the Constitution but CANNOT destroy its 'basic structure.' The Preamble reflects the basic structure. Key elements include: supremacy of Constitution, republican and democratic form, secular character, separation of powers, federal character, and judicial review."},{"q_no":4,"topic":"Fundamental Rights","question":"The right to property was a Fundamental Right under Article 19(1)(f) and Article 31. It was deleted and made a constitutional/legal right under Article 300-A by which Amendment?","options":{"A":"25th Amendment","B":"42nd Amendment","C":"44th Amendment","D":"46th Amendment"},"correct":"C","answer_text":"44th Amendment (1978)","explanation":"The 44th Amendment Act, 1978 deleted Articles 19(1)(f) and 31, and inserted Article 300-A making the right to property only a legal right, not a Fundamental Right.","concept_note":null},{"q_no":5,"topic":"Fundamental Rights","question":"Which Article of the Constitution deals with the Right to Equality before law and equal protection of law?","options":{"A":"Article 13","B":"Article 14","C":"Article 15","D":"Article 16"},"correct":"B","answer_text":"Article 14","explanation":"Article 14 provides that the State shall not deny to any person equality before the law or the equal protection of the laws within the territory of India.","concept_note":null},{"q_no":6,"topic":"Fundamental Rights","question":"The doctrine of 'Reasonable Classification' under Article 14 requires:","options":{"A":"The classification must be based on intelligible differentia only","B":"The differentia must have a rational nexus to the object sought to be achieved","C":"Both A and B","D":"Neither A nor B"},"correct":"C","answer_text":"Both A and B","explanation":"Two cumulative tests under Article 14: (1) intelligible differentia — the basis of classification must be clear and distinct; (2) rational nexus — the classification must be rationally connected to the object of the law. Leading case: State of West Bengal v. Anwar Ali Sarkar (1952).","concept_note":"Article 14 prohibits class legislation but permits reasonable classification. Both conditions must be satisfied simultaneously — intelligible differentia AND rational nexus to the object of the legislation."},{"q_no":7,"topic":"Fundamental Rights","question":"'Arbitrariness' as a ground to strike down state action under Article 14 was evolved in which case?","options":{"A":"Maneka Gandhi v. Union of India","B":"E.P. Royappa v. State of Tamil Nadu","C":"R.D. Shetty v. International Airport Authority","D":"Ajay Hasia v. Khalid Mujib"},"correct":"B","answer_text":"E.P. Royappa v. State of Tamil Nadu (1974)","explanation":"In E.P. Royappa (1974), the Supreme Court held that equality is antithetic to arbitrariness and any arbitrary State action violates Article 14. This expanded Article 14 beyond mere 'reasonable classification' to strike down arbitrary executive action.","concept_note":null},{"q_no":8,"topic":"Fundamental Rights","question":"Article 15 prohibits discrimination on grounds of:","options":{"A":"Religion, Race, Caste, Sex, Place of birth","B":"Religion, Race, Caste, Sex, Place of domicile","C":"Religion, Race, Caste, Language, Place of birth","D":"Religion, Caste, Language, Sex, Place of birth"},"correct":"A","answer_text":"Religion, Race, Caste, Sex, Place of birth","explanation":"Article 15(1) prohibits discrimination ONLY on grounds of religion, race, caste, sex, or place of birth. Language and domicile are NOT included in Article 15.","concept_note":null},{"q_no":9,"topic":"Fundamental Rights","question":"Which Article enables the State to make special provisions for women and children?","options":{"A":"Article 15(3)","B":"Article 15(4)","C":"Article 16(4)","D":"Article 21-A"},"correct":"A","answer_text":"Article 15(3)","explanation":"Article 15(3) provides that nothing in Article 15 shall prevent the State from making any special provision for women and children. Article 15(4) is for backward classes.","concept_note":null},{"q_no":10,"topic":"Fundamental Rights","question":"The concept of 'substantive due process' under Indian Constitutional Law was evolved through the interpretation of which Article?","options":{"A":"Article 14","B":"Article 19","C":"Article 21","D":"Article 32"},"correct":"C","answer_text":"Article 21","explanation":"In Maneka Gandhi v. Union of India (1978), the SC held that the procedure under Article 21 must be just, fair and reasonable — importing substantive due process into Indian Constitutional Law.","concept_note":"Article 21 Expansion: Originally in A.K. Gopalan v. State of Madras (1950), Article 21 was narrowly interpreted. In Maneka Gandhi (1978), the SC held procedure must be just, fair and reasonable. Post-Maneka, Article 21 has been expanded to include right to livelihood, right to privacy (Puttaswamy, 2017), right to health, right to education (now 21-A), right to dignified death, etc."},{"q_no":11,"topic":"Fundamental Rights","question":"Right to Education as a Fundamental Right was inserted as Article 21-A by which Constitutional Amendment?","options":{"A":"86th Amendment Act, 2002","B":"93rd Amendment Act, 2005","C":"97th Amendment Act, 2011","D":"44th Amendment Act, 1978"},"correct":"A","answer_text":"86th Amendment Act, 2002","explanation":"The 86th Constitutional Amendment Act, 2002 inserted Article 21-A providing free and compulsory education to children between 6–14 years as a Fundamental Right.","concept_note":null},{"q_no":12,"topic":"Fundamental Rights","question":"Which case held that 'Right to Privacy' is a Fundamental Right under Article 21?","options":{"A":"NALSA v. Union of India","B":"K.S. Puttaswamy v. Union of India","C":"Navtej Singh Johar v. Union of India","D":"Joseph Shine v. Union of India"},"correct":"B","answer_text":"K.S. Puttaswamy v. Union of India (2017) — 9-judge bench","explanation":"In K.S. Puttaswamy v. Union of India (2017), a 9-judge constitutional bench unanimously held that privacy is a fundamental right under Article 21 of the Constitution.","concept_note":null},{"q_no":13,"topic":"Fundamental Rights","question":"Which Article of the Constitution provides for the Right against exploitation — prohibition of traffic in human beings and forced labour?","options":{"A":"Article 21","B":"Article 23","C":"Article 24","D":"Article 22"},"correct":"B","answer_text":"Article 23","explanation":"Article 23 prohibits traffic in human beings, begar and other similar forms of forced labour. Article 24 prohibits employment of children below 14 years in factories, mines or other hazardous work.","concept_note":null},{"q_no":14,"topic":"Fundamental Rights","question":"Freedom of religion is guaranteed under Articles:","options":{"A":"Articles 25–28","B":"Articles 29–30","C":"Articles 19–22","D":"Articles 23–24"},"correct":"A","answer_text":"Articles 25–28","explanation":"Articles 25–28 deal with freedom of religion. Articles 29–30 deal with cultural and educational rights of minorities.","concept_note":null},{"q_no":15,"topic":"Emergency Provisions","question":"Which of the following Fundamental Rights can be suspended during a National Emergency declared under Article 352?","options":{"A":"Articles 14 and 15 only","B":"Articles 20 and 21 only","C":"All Fundamental Rights except Articles 20 and 21","D":"All Fundamental Rights"},"correct":"C","answer_text":"All Fundamental Rights except Articles 20 and 21","explanation":"The 44th Amendment, 1978 made Articles 20 and 21 non-suspendable even during a National Emergency. All other Fundamental Rights can be suspended by Presidential Order under Article 359.","concept_note":null},{"q_no":16,"topic":"Directive Principles","question":"Directive Principles of State Policy are contained in which Part of the Constitution?","options":{"A":"Part III","B":"Part IV","C":"Part IVA","D":"Part XIV"},"correct":"B","answer_text":"Part IV (Articles 36–51)","explanation":"Part III contains Fundamental Rights (Articles 12–35). Part IV contains Directive Principles (Articles 36–51). Part IVA contains Fundamental Duties (Article 51-A).","concept_note":null},{"q_no":17,"topic":"Directive Principles","question":"Directive Principles are NOT enforceable in court. Which Article makes this explicit?","options":{"A":"Article 36","B":"Article 37","C":"Article 38","D":"Article 40"},"correct":"B","answer_text":"Article 37","explanation":"Article 37 states that the provisions in Part IV shall not be enforceable by any court, but the principles are nevertheless fundamental in the governance of the country.","concept_note":null},{"q_no":18,"topic":"Directive Principles","question":"In the conflict between Fundamental Rights and Directive Principles, which prevails according to Minerva Mills v. Union of India (1980)?","options":{"A":"Directive Principles always prevail","B":"Fundamental Rights always prevail","C":"There is a harmonious balance; neither can destroy the other","D":"Parliament can decide case by case"},"correct":"C","answer_text":"There is a harmonious balance; neither can destroy the other","explanation":"In Minerva Mills (1980), the Court struck down provisions of the 42nd Amendment which gave absolute primacy to DPSPs, holding that harmony between Parts III and IV is itself a basic feature of the Constitution.","concept_note":"FR vs DPSP Evolution: State of Madras v. Champakam Dorairajan (1951) — FRs prevailed; Golaknath (1967) — FRs unamendable; Kesavananda Bharati (1973) — both can coexist; Minerva Mills (1980) — harmony between Parts III and IV is basic structure."},{"q_no":19,"topic":"Directive Principles","question":"Which Directive Principle directs the State to organize village panchayats?","options":{"A":"Article 39","B":"Article 40","C":"Article 41","D":"Article 43"},"correct":"B","answer_text":"Article 40","explanation":"Article 40 directs the State to take steps to organise village panchayats and endow them with such powers and authority as may be necessary to enable them to function as units of self-government.","concept_note":null},{"q_no":20,"topic":"Fundamental Duties","question":"Fundamental Duties are contained in which Article of the Constitution?","options":{"A":"Article 50A","B":"Article 51-A","C":"Article 52-A","D":"Article 51"},"correct":"B","answer_text":"Article 51-A","explanation":"Article 51-A, inserted by the 42nd Amendment, 1976, contains the Fundamental Duties. The 11th duty was added by the 86th Amendment, 2002.","concept_note":null},{"q_no":21,"topic":"Fundamental Duties","question":"How many Fundamental Duties are currently in Article 51-A?","options":{"A":"10","B":"11","C":"12","D":"9"},"correct":"B","answer_text":"11","explanation":"Originally 10 Fundamental Duties were inserted by the 42nd Amendment (1976). The 11th duty — to provide opportunities for education to children between 6-14 years — was added by the 86th Amendment (2002).","concept_note":null},{"q_no":22,"topic":"Fundamental Rights","question":"The 'golden triangle' in Constitutional Law refers to:","options":{"A":"Articles 14, 19, and 21","B":"Articles 12, 13, and 14","C":"Articles 21, 22, and 23","D":"Articles 19, 20, and 21"},"correct":"A","answer_text":"Articles 14, 19, and 21","explanation":"The 'golden triangle' of Articles 14, 19, and 21 was evolved in Maneka Gandhi v. Union of India (1978). Any law that affects these rights must pass the test of all three Articles.","concept_note":null},{"q_no":23,"topic":"Fundamental Rights","question":"Article 13 declares void any law that is inconsistent with or in derogation of Fundamental Rights. The phrase 'law' here includes:","options":{"A":"Legislation only","B":"Ordinances only","C":"Laws in force including ordinances, regulations, customs and usages","D":"Constitutional amendments only"},"correct":"C","answer_text":"Laws in force including ordinances, regulations, customs and usages","explanation":"Article 13(3)(a) defines 'law' to include any Ordinance, order, bye-law, rule, regulation, notification, custom or usage. Constitutional amendments were held NOT to be 'law' under Article 13 in Kesavananda Bharati.","concept_note":null},{"q_no":24,"topic":"Fundamental Rights","question":"Which Article gives the Supreme Court power to issue writs for enforcement of Fundamental Rights?","options":{"A":"Article 226","B":"Article 136","C":"Article 32","D":"Article 131"},"correct":"C","answer_text":"Article 32","explanation":"Article 32 is the 'heart and soul' of the Constitution (Dr. Ambedkar). It gives the Supreme Court power to issue writs including habeas corpus, mandamus, prohibition, certiorari, and quo warranto for enforcement of Fundamental Rights.","concept_note":null},{"q_no":25,"topic":"Judiciary","question":"Article 32 and Article 226 — what is the distinction?","options":{"A":"Art. 32 is for SC; Art. 226 is for High Courts; Art. 226 is wider in scope","B":"Art. 32 is for SC; Art. 226 is for High Courts; Art. 32 is wider","C":"Both are identical in scope","D":"Art. 226 can only be used for Fundamental Rights enforcement"},"correct":"A","answer_text":"Art. 32 is for SC; Art. 226 is for HCs; Art. 226 is wider in scope","explanation":"Article 32 is for Supreme Court — only for Fundamental Rights enforcement. Article 226 is for High Courts — wider, can be used for enforcement of any legal right, not just Fundamental Rights.","concept_note":null},{"q_no":26,"topic":"Union Executive","question":"The executive power of the Union is vested in:","options":{"A":"The Prime Minister","B":"The Council of Ministers","C":"The President of India","D":"The Parliament"},"correct":"C","answer_text":"The President of India (Article 53)","explanation":"Article 53 vests the executive power of the Union in the President. However, the President is a constitutional head who acts on the advice of the Council of Ministers (Article 74).","concept_note":null},{"q_no":27,"topic":"Union Executive","question":"The President of India is elected by:","options":{"A":"Direct election by citizens","B":"Elected members of Parliament only","C":"Elected members of Parliament + Elected members of State Legislative Assemblies","D":"All members of Parliament + all members of State Legislatures"},"correct":"C","answer_text":"Elected members of Parliament + Elected members of State Legislative Assemblies — Article 54","explanation":"The electoral college consists of elected members of both Houses of Parliament and elected members of the Legislative Assemblies of States (including Delhi and Puducherry). Nominated members and members of State Legislative Councils are excluded.","concept_note":null},{"q_no":28,"topic":"Union Executive","question":"Article 74(1) provides that the Council of Ministers headed by the PM shall 'aid and advise' the President. After the 44th Amendment, the President:","options":{"A":"Can reject the advice","B":"Shall act in accordance with such advice","C":"Can refer it back once but must act on revised advice","D":"Must consult the Supreme Court before acting"},"correct":"C","answer_text":"Can refer it back once but must act on revised advice","explanation":"The 44th Amendment (1978) added a proviso to Article 74(1): The President may return the advice for reconsideration, but if re-tendered, the President shall act accordingly.","concept_note":null},{"q_no":29,"topic":"State Executive","question":"The Governor of a State is appointed by:","options":{"A":"The State Legislature","B":"The Prime Minister","C":"The President of India","D":"The Chief Minister"},"correct":"C","answer_text":"The President of India (Article 155)","explanation":"Article 155 provides that the Governor of each State shall be appointed by the President by warrant under his hand and seal.","concept_note":null},{"q_no":30,"topic":"Legislative Powers","question":"Which Article empowers the Parliament to legislate on State List subjects in the national interest?","options":{"A":"Article 249","B":"Article 250","C":"Article 252","D":"Article 253"},"correct":"A","answer_text":"Article 249","explanation":"Article 249 empowers Parliament to legislate on State List subjects if the Rajya Sabha passes a resolution by 2/3 majority declaring it is necessary or expedient in the national interest.","concept_note":null},{"q_no":31,"topic":"Legislative Powers","question":"'Pith and Substance' doctrine is used in Constitutional Law to:","options":{"A":"Interpret Fundamental Rights","B":"Determine legislative competence when a law covers subjects in different Lists","C":"Decide conflicts between Union and State executives","D":"Interpret the Preamble"},"correct":"B","answer_text":"Determine legislative competence when a law covers subjects in different Lists","explanation":"The Pith and Substance doctrine means that if a State law incidentally encroaches on a Union subject (or vice versa), courts look at the true nature and character of the legislation. If it substantially falls within the legislature's competence, it is valid.","concept_note":"Pith and Substance: Leading cases — Profulla Kumar Mukherjee v. Bank of Khulna (1947 PC); State of Bombay v. F.N. Balsara (1951). Courts look at the dominant purpose and true nature of the legislation."},{"q_no":32,"topic":"Legislative Powers","question":"'Colorable Legislation' refers to a situation where:","options":{"A":"The legislature tries to do indirectly what it cannot do directly","B":"Legislation is unconstitutional due to mala fide intent","C":"Legislation uses colorful/ambiguous language","D":"Both A and B"},"correct":"A","answer_text":"The legislature tries to do indirectly what it cannot do directly","explanation":"Colorable legislation means the legislature, though apparently acting within its powers, in substance encroaches upon the field reserved for the other legislature. Leading case: K.C. Gajapati Narayan Deo v. State of Orissa.","concept_note":null},{"q_no":33,"topic":"Legislative Powers","question":"The Union List, State List, and Concurrent List are contained in which Schedule of the Constitution?","options":{"A":"Fifth Schedule","B":"Sixth Schedule","C":"Seventh Schedule","D":"Eighth Schedule"},"correct":"C","answer_text":"Seventh Schedule","explanation":"The Seventh Schedule contains three lists: List I (Union List — 97 entries), List II (State List — 66 entries), and List III (Concurrent List — 47 entries). Currently List I has 100 entries.","concept_note":null},{"q_no":34,"topic":"Legislative Powers","question":"In case of repugnancy between a Union law and a State law on a Concurrent List subject, which prevails under Article 254?","options":{"A":"State law always prevails","B":"Union law prevails","C":"The later law prevails regardless of maker","D":"President decides"},"correct":"B","answer_text":"Union law prevails — Article 254(1)","explanation":"Under Article 254(1), if there is a repugnancy between Union and State laws on a Concurrent List subject, the Union law prevails and the State law is void to the extent of repugnancy. Exception under Article 254(2): if the State law has received Presidential assent, it prevails in that State.","concept_note":null},{"q_no":35,"topic":"Union-State Relations","question":"Which Article provides for Inter-State Council for coordination between States and the Union?","options":{"A":"Article 261","B":"Article 263","C":"Article 265","D":"Article 267"},"correct":"B","answer_text":"Article 263","explanation":"Article 263 empowers the President to establish an Inter-State Council if it appears to him that the public interests would be served by the establishment of such a council.","concept_note":null},{"q_no":36,"topic":"State Legislature","question":"Article 200 deals with:","options":{"A":"Assent to Bills by the Governor","B":"Assent to Bills by the President","C":"Money Bills in State Legislature","D":"Joint sitting of Parliament"},"correct":"A","answer_text":"Assent to Bills by the Governor","explanation":"Article 200 provides that when a Bill has been passed by the State Legislature, it shall be presented to the Governor who shall declare his assent, withhold assent, return (non-money bill) for reconsideration, or reserve it for the President.","concept_note":null},{"q_no":37,"topic":"Legislative Powers","question":"The concept of 'Implied Powers' in constitutional interpretation means:","options":{"A":"Powers that can be inferred from express provisions","B":"Powers not mentioned anywhere in the Constitution","C":"Emergency powers","D":"Residuary powers"},"correct":"A","answer_text":"Powers that can be inferred from express provisions","explanation":"Implied powers are those which are not expressly mentioned but are necessary to carry out the express powers. The doctrine is used to fill gaps in legislative competence.","concept_note":null},{"q_no":38,"topic":"Legislative Powers","question":"Residuary powers under Article 248 vest in:","options":{"A":"States","B":"Union Parliament","C":"President","D":"Concurrent List"},"correct":"B","answer_text":"Union Parliament","explanation":"Article 248 gives Parliament exclusive power to make any law with respect to any matter not enumerated in the Concurrent or State List (residuary powers). Entry 97 of List I also confirms residuary powers.","concept_note":null},{"q_no":39,"topic":"Judiciary","question":"Independence of the judiciary is secured by which provision among others?","options":{"A":"Salaries charged to Consolidated Fund of India","B":"Removal only by impeachment","C":"Security of tenure","D":"All of the above"},"correct":"D","answer_text":"All of the above","explanation":"Judicial independence is secured through multiple mechanisms: fixed salaries charged to Consolidated Fund (not subject to vote), security of tenure until retirement age, removal only through impeachment process.","concept_note":null},{"q_no":40,"topic":"Judiciary","question":"The process of appointment of Supreme Court judges — the 'Collegium System' — was evolved through:","options":{"A":"First Judges Case (1981)","B":"Second Judges Case (1993)","C":"Third Judges Case (1998)","D":"All three together established the current system"},"correct":"D","answer_text":"All three together established the current system","explanation":"First Judges Case (S.P. Gupta, 1981) — Executive primacy. Second Judges Case (1993) — Collegium system; CJI's opinion gets primacy. Third Judges Case (1998) — Collegium = CJI + 4 senior-most SC judges. NJAC (99th Amendment, 2014) was struck down in 2015.","concept_note":"Three Judges Cases: The current collegium system where the Chief Justice and 4 senior-most judges recommend appointments gives the judiciary primacy over executive in judicial appointments. The NJAC established by 99th Amendment (2014) was struck down as violative of judicial independence — itself a basic structure element."},{"q_no":41,"topic":"Judiciary","question":"Article 141 provides that the law declared by the Supreme Court shall be binding on:","options":{"A":"All High Courts only","B":"All courts in India","C":"All courts in India except the Supreme Court itself","D":"All lower courts only"},"correct":"B","answer_text":"All courts in India","explanation":"Article 141 provides that the law declared by the Supreme Court shall be binding on all courts within the territory of India. The Supreme Court itself follows the principle of stare decisis but is not absolutely bound by its own decisions.","concept_note":null},{"q_no":42,"topic":"Judiciary","question":"The Supreme Court's original jurisdiction in disputes between States is provided under:","options":{"A":"Article 131","B":"Article 132","C":"Article 136","D":"Article 143"},"correct":"A","answer_text":"Article 131","explanation":"Article 131 gives the Supreme Court exclusive original jurisdiction to adjudicate disputes between the Government of India and one or more States, or between two or more States.","concept_note":null},{"q_no":43,"topic":"Judiciary","question":"Article 136 — Special Leave Petition (SLP) — grants the Supreme Court:","options":{"A":"Original jurisdiction","B":"Advisory jurisdiction","C":"Discretionary appellate jurisdiction","D":"Revisional jurisdiction"},"correct":"C","answer_text":"Discretionary appellate jurisdiction","explanation":"Article 136 grants the Supreme Court wide discretionary power to grant special leave to appeal from any judgment, decree, determination, sentence, or order of any court or tribunal in India.","concept_note":null},{"q_no":44,"topic":"Judiciary","question":"Public Interest Litigation (PIL) as a concept is an extension of:","options":{"A":"Article 32 and Article 226 jurisdiction (epistolary jurisdiction)","B":"Article 131 jurisdiction","C":"Article 143 advisory opinion","D":"Article 136 SLP"},"correct":"A","answer_text":"Article 32 and Article 226 jurisdiction (epistolary jurisdiction)","explanation":"PIL evolved through liberalization of locus standi under Articles 32 and 226. The SC allowed any public-spirited person to write a letter (epistolary jurisdiction) to approach the court on behalf of those unable to access justice. Pioneered by Justices P.N. Bhagwati and V.R. Krishna Iyer.","concept_note":null},{"q_no":45,"topic":"Judiciary","question":"Which Article provides for the High Court's power of superintendence over all subordinate courts?","options":{"A":"Article 226","B":"Article 227","C":"Article 228","D":"Article 235"},"correct":"B","answer_text":"Article 227","explanation":"Article 227 gives every High Court the power of superintendence over all courts and tribunals throughout the territories in relation to which it exercises jurisdiction.","concept_note":null},{"q_no":46,"topic":"Judiciary","question":"The doctrine of 'judicial review' in India covers:","options":{"A":"Constitutionality of legislative and executive action only","B":"Only legislative acts","C":"Legislative acts, executive actions, and constitutional amendments (subject to basic structure)","D":"Only executive actions"},"correct":"C","answer_text":"Legislative acts, executive actions, and constitutional amendments (subject to basic structure)","explanation":"Judicial review in India covers three areas: (1) legislative acts — struck down if violate Constitution; (2) executive/administrative actions — struck down if ultra vires, unreasonable, or against natural justice; (3) constitutional amendments — struck down if they violate basic structure (post-Kesavananda Bharati).","concept_note":null},{"q_no":47,"topic":"Emergency Provisions","question":"Article 352 deals with which type of Emergency?","options":{"A":"Financial Emergency","B":"President's Rule","C":"National Emergency","D":"Internal Disturbance Emergency"},"correct":"C","answer_text":"National Emergency","explanation":"Article 352 deals with National Emergency on grounds of war, external aggression, or armed rebellion. Article 356 is President's Rule. Article 360 is Financial Emergency.","concept_note":null},{"q_no":48,"topic":"Emergency Provisions","question":"During a National Emergency, Article 358 suspends which rights automatically?","options":{"A":"All rights under Article 19","B":"Rights under Articles 20 and 21","C":"All Fundamental Rights","D":"Only Article 19(1)(a)"},"correct":"A","answer_text":"All rights under Article 19 — automatically suspended during war/external aggression emergency","explanation":"Article 358 provides for automatic suspension of Article 19 freedoms when a National Emergency is proclaimed on grounds of war or external aggression. Article 359 requires a Presidential Order for suspending other FRs (but NOT Articles 20 & 21).","concept_note":null},{"q_no":49,"topic":"Emergency Provisions","question":"National Emergency under Article 352 can be proclaimed by the President on the written advice of:","options":{"A":"Parliament","B":"Prime Minister alone","C":"Cabinet (Council of Ministers)","D":"Chief Justice of India"},"correct":"C","answer_text":"Cabinet (Council of Ministers)","explanation":"After the 44th Amendment (1978), the proclamation of National Emergency requires the written advice of the Cabinet (Council of Ministers). The Prime Minister alone cannot advise such proclamation — it must be a Cabinet decision in writing.","concept_note":null},{"q_no":50,"topic":"Emergency Provisions","question":"President's Rule under Article 356 can be imposed when:","options":{"A":"The State government violates Fundamental Rights","B":"The constitutional machinery of the State has failed","C":"The Governor recommends only","D":"There is financial mismanagement in the State"},"correct":"B","answer_text":"The constitutional machinery of the State has failed","explanation":"Article 356 can be invoked when the President is satisfied on receipt of a report from the Governor or otherwise that the government of the State cannot be carried on in accordance with the provisions of the Constitution.","concept_note":"S.R. Bommai v. Union of India (1994): 9-judge bench held Art. 356 is subject to judicial review. Floor of the House is the only place to test majority. Secularism is a basic feature — a State government acting against secularism can be dismissed under Art. 356."},{"q_no":51,"topic":"Emergency Provisions","question":"The maximum period for which Financial Emergency under Article 360 can operate continuously without Parliament's approval:","options":{"A":"2 months","B":"6 months","C":"1 year","D":"Indefinitely with Parliament's approval every 2 months initially"},"correct":"D","answer_text":"Indefinitely — there is no maximum period specified; approved by Parliament it continues until revoked","explanation":"Unlike National Emergency and President's Rule, Financial Emergency under Article 360 has NO maximum period. Once proclaimed and approved by Parliament, it continues until the President revokes it. Initial approval must be within 2 months.","concept_note":null},{"q_no":52,"topic":"Emergency Provisions","question":"For continuation of National Emergency after one month, approval must be by:","options":{"A":"Simple majority of Parliament","B":"Special majority of Parliament (2/3 of total membership + majority present and voting)","C":"Joint sitting of Parliament","D":"Both Houses separately by simple majority"},"correct":"B","answer_text":"Special majority — Article 352(6)","explanation":"National Emergency requires approval by special majority: not less than two-thirds of the members of each House of Parliament present and voting AND a majority of the total membership of each House.","concept_note":null},{"q_no":53,"topic":"Emergency Provisions","question":"The 44th Amendment, 1978 made which key change regarding Emergency provisions?","options":{"A":"Added Article 352","B":"Changed 'internal disturbance' to 'armed rebellion' and required Cabinet's written advice","C":"Created Financial Emergency","D":"Abolished President's Rule"},"correct":"B","answer_text":"Changed 'internal disturbance' to 'armed rebellion' and required Cabinet's written advice","explanation":"The 44th Amendment (1978) made key changes: (1) substituted 'armed rebellion' for 'internal disturbance'; (2) required Cabinet's written advice before proclamation; (3) made Articles 20 and 21 non-suspendable; (4) raised the majority required for approval.","concept_note":null},{"q_no":54,"topic":"Emergency Provisions","question":"Rajasthan v. Union of India (1977) was significant because:","options":{"A":"It invalidated imposition of President's Rule","B":"It held that President's Rule proclamation under Article 356 was entirely non-justiciable","C":"It first established the collegium system","D":"It interpreted the Preamble"},"correct":"B","answer_text":"It held that President's Rule proclamation under Article 356 was entirely non-justiciable","explanation":"In Rajasthan v. Union of India (1977), the Supreme Court held that the proclamation under Article 356 was non-justiciable. This position was later overruled by the landmark S.R. Bommai v. Union of India (1994).","concept_note":null},{"q_no":55,"topic":"Special Provisions","question":"The special provisions for certain States are contained in which Part of the Constitution?","options":{"A":"Part XX","B":"Part XXI","C":"Part XXII","D":"Part XIX"},"correct":"B","answer_text":"Part XXI (Articles 369–392)","explanation":"Part XXI of the Constitution (Articles 369-392) contains temporary, transitional and special provisions including special provisions for certain States under Articles 370-371J.","concept_note":null},{"q_no":56,"topic":"Special Provisions","question":"Article 370, which granted special status to Jammu & Kashmir, was:","options":{"A":"Repealed by Parliament","B":"Its operative provisions abrogated by Presidential Order in August 2019","C":"Struck down by Supreme Court","D":"Amended by 99th Amendment"},"correct":"B","answer_text":"Operative provisions abrogated by Presidential Order CO 272 in August 2019","explanation":"Presidential Order CO 272 (2019) effectively abrogated Article 370's special provisions. J&K was reorganized into two Union Territories — J&K and Ladakh. The Supreme Court upheld the abrogation in Dr. Farooq Abdullah v. Union of India (2023).","concept_note":null},{"q_no":57,"topic":"Special Provisions","question":"Article 371 relates to special provisions for which State?","options":{"A":"Nagaland","B":"Maharashtra and Gujarat","C":"Assam","D":"Mizoram"},"correct":"B","answer_text":"Maharashtra and Gujarat","explanation":"Article 371 — Maharashtra and Gujarat. Article 371-A — Nagaland. Article 371-B — Assam. Article 371-C — Manipur. Article 371-D — Andhra Pradesh. Article 371-F — Sikkim. Article 371-G — Mizoram. Article 371-H — Arunachal Pradesh.","concept_note":null},{"q_no":58,"topic":"Special Provisions","question":"Which Article allows Parliament to provide for the establishment of local legislatures or Councils of Ministers for Union Territories?","options":{"A":"Article 239","B":"Article 239-A","C":"Article 240","D":"Article 241"},"correct":"B","answer_text":"Article 239-A","explanation":"Article 239-A was inserted by the 14th Amendment, 1962. It allows Parliament to create a body to function as a Legislature or a Council of Ministers or both for certain Union Territories.","concept_note":null},{"q_no":59,"topic":"Election Commission","question":"The Election Commission of India is established under which Article of the Constitution?","options":{"A":"Article 323","B":"Article 324","C":"Article 326","D":"Article 328"},"correct":"B","answer_text":"Article 324","explanation":"Article 324 vests the superintendence, direction, and control of the preparation of electoral rolls and the conduct of all elections to Parliament and State Legislatures in the Election Commission of India.","concept_note":null},{"q_no":60,"topic":"Election Commission","question":"The Chief Election Commissioner can be removed from office:","options":{"A":"By the President at will","B":"Only in the same manner as a Supreme Court judge","C":"By a resolution of Parliament","D":"By the Prime Minister"},"correct":"B","answer_text":"Only in the same manner as a Supreme Court judge — Article 324(5)","explanation":"The CEC is removed from office in the same manner and on the same grounds as a Supreme Court judge — by an address of each House of Parliament supported by a majority of total membership and not less than two-thirds of members present and voting.","concept_note":null},{"q_no":61,"topic":"Election Commission","question":"The Election Commission becomes multi-member when:","options":{"A":"There are more than 3 candidates in any election","B":"The President so appoints other Election Commissioners","C":"Parliament passes a law for it","D":"During general elections only"},"correct":"B","answer_text":"When President appoints other Election Commissioners (Article 324(2))","explanation":"Article 324(2) provides that the Election Commission shall consist of the CEC and such number of other Election Commissioners as the President may from time to time fix.","concept_note":null},{"q_no":62,"topic":"Election Commission","question":"The Model Code of Conduct is:","options":{"A":"A statutory document under Representation of People Act","B":"A constitutional provision","C":"A set of guidelines evolved by the Election Commission — not statutory, but binding in practice","D":"An executive order under Article 77"},"correct":"C","answer_text":"Guidelines evolved by ECI — not statutory but binding in practice","explanation":"The Model Code of Conduct is not a statutory document. It is a set of guidelines evolved by the Election Commission to regulate the conduct of political parties and candidates during elections. It derives force from Article 324.","concept_note":null},{"q_no":63,"topic":"Election Commission","question":"In T.N. Seshan v. Union of India (1995), the Supreme Court held:","options":{"A":"Election Commission cannot have multiple members","B":"The CEC and other Election Commissioners have equal powers; CEC has no veto","C":"President's supervision over Election Commission is valid","D":"Model Code of Conduct is legally binding"},"correct":"B","answer_text":"The CEC and other Election Commissioners have equal powers; CEC has no veto","explanation":"The Supreme Court in T.N. Seshan (1995) held that all Election Commissioners have equal powers and the CEC does not have a veto over the other Commissioners. Decisions are taken by majority.","concept_note":null},{"q_no":64,"topic":"Administrative Law","question":"Which scholar defined Administrative Law as 'the law relating to the control of governmental power'?","options":{"A":"Garner","B":"H.W.R. Wade","C":"Dicey","D":"Ivor Jennings"},"correct":"B","answer_text":"H.W.R. Wade","explanation":"H.W.R. Wade defined administrative law as 'the law relating to the control of governmental power.' Garner defined it as 'that branch of public law which is concerned with the composition, powers and duties of administrative authorities.'","concept_note":null},{"q_no":65,"topic":"Administrative Law","question":"A.V. Dicey was opposed to Administrative Law (Droit Administratif). His main objection was:","options":{"A":"It gave too much power to courts","B":"It created a separate system of law for government officials, violating Rule of Law","C":"It was borrowed from French law","D":"It was not codified"},"correct":"B","answer_text":"It created a separate system of law for government officials, violating Rule of Law","explanation":"Dicey opposed Droit Administratif (French administrative law) because he believed in the Rule of Law which required every person, including government officials, to be subject to the same ordinary law of the land administered by ordinary courts.","concept_note":"Dicey's Rule of Law: Three meanings — (1) Supremacy of law; (2) Equality before the law — every man subject to ordinary law; (3) Constitution as a consequence of individual rights. Dicey was later corrected by Jennings and Wade who showed Droit Administratif actually protects citizens from the State."},{"q_no":66,"topic":"Administrative Law","question":"The 'Droit Administratif' system of France is characterized by:","options":{"A":"Courts using stare decisis in administrative decisions","B":"Separate administrative courts (Conseil d'État) to deal with disputes involving the State","C":"Supremacy of ordinary civil courts","D":"Complete immunity of the State from suit"},"correct":"B","answer_text":"Separate administrative courts (Conseil d'État) to deal with disputes involving the State","explanation":"The French Droit Administratif system has a dual system of courts — ordinary courts for private law matters and separate administrative courts (headed by Conseil d'État) for disputes involving the State. France follows civil law tradition, not common law stare decisis.","concept_note":null},{"q_no":67,"topic":"Administrative Law","question":"Which of the following best describes delegated legislation?","options":{"A":"Legislation made by Parliament directly","B":"Legislation made by executive bodies under authority conferred by Parliament","C":"Legislation by constitutional amendment","D":"Judicial precedent that creates law"},"correct":"B","answer_text":"Legislation made by executive bodies under authority conferred by Parliament","explanation":"Delegated (subordinate/subsidiary) legislation is law made by executive bodies (ministers, local authorities, statutory corporations) under specific authority conferred by an Act of Parliament.","concept_note":"Delegated Legislation: Parliament delegates legislative power to executive bodies to make rules/regulations/bye-laws. Subject to judicial review on grounds of: (1) ultra vires parent Act; (2) violation of FRs; (3) unreasonableness; (4) procedural defects. Key case: Delhi Laws Act Case (1951) — excessive delegation is unconstitutional."},{"q_no":68,"topic":"Administrative Law","question":"The principle against 'excessive delegation' means:","options":{"A":"Parliament cannot delegate at all","B":"Parliament cannot abdicate itself — it must lay down policy; details only can be delegated","C":"All delegated legislation is void","D":"The executive can override parliamentary enactments"},"correct":"B","answer_text":"Parliament cannot abdicate itself — must lay down policy; details only can be delegated","explanation":"The doctrine of excessive delegation means Parliament must retain control by laying down the legislative policy and standards. Only the working out of details can be delegated. Leading case: In re Delhi Laws Act, AIR 1951 SC 332.","concept_note":null},{"q_no":69,"topic":"Administrative Law","question":"'Ombudsman' concept originated in which country?","options":{"A":"France","B":"United Kingdom","C":"Sweden","D":"United States"},"correct":"C","answer_text":"Sweden (1809)","explanation":"The concept of Ombudsman originated in Sweden in 1809. The Riksdag (Swedish Parliament) appointed the first Ombudsman to oversee the application of laws by officials. India's equivalent is Lokpal (Union) and Lokayukta (State).","concept_note":null},{"q_no":70,"topic":"Administrative Law","question":"Which Article of the Constitution is the basis for the 'State' being made accountable in administrative law?","options":{"A":"Article 12","B":"Article 13","C":"Article 15","D":"Article 21"},"correct":"A","answer_text":"Article 12 — defines 'State' for Part III purposes","explanation":"Article 12 defines 'State' for the purposes of Part III (Fundamental Rights). It includes the Government and Parliament of India, the Government and Legislature of each State, and all local or other authorities within India or under the control of the Government of India.","concept_note":null},{"q_no":71,"topic":"Administrative Law","question":"In Pradeep Kumar Biswas v. Indian Institute of Chemical Biology (2002), the Supreme Court laid down the test for a body to be 'State' under Article 12 as:","options":{"A":"Government ownership alone","B":"Functional control and financial dependence on government — 'instrumentality or agency of State'","C":"Whether the body receives grants","D":"Whether the body is a statutory corporation"},"correct":"B","answer_text":"Functional control and financial dependence — 'instrumentality or agency of State'","explanation":"In Pradeep Kumar Biswas (2002), a 7-judge bench overruled Sabhajit Tewary v. Union of India and established the 'functional test' — a body is 'State' if it is an instrumentality or agency of the State based on factors like financial dependence, functional control, and whether the functions are of public importance.","concept_note":null},{"q_no":72,"topic":"Natural Justice","question":"The two main rules of Natural Justice are:","options":{"A":"Audi alteram partem and Res judicata","B":"Nemo debet esse judex in propria causa and Audi alteram partem","C":"Nemo judex and Stare decisis","D":"Audi alteram partem and Nemo tenetur"},"correct":"B","answer_text":"Nemo debet esse judex in propria causa and Audi alteram partem","explanation":"The two pillars of natural justice are: (1) Nemo debet esse judex in propria sua causa — no one shall be a judge in his own cause (rule against bias); (2) Audi alteram partem — hear the other side (right to fair hearing).","concept_note":null},{"q_no":73,"topic":"Natural Justice","question":"'Audi alteram partem' means:","options":{"A":"No one shall be a judge in his own cause","B":"Hear the other side — right to a fair hearing","C":"Let the master answer","D":"Act of the court shall prejudice no man"},"correct":"B","answer_text":"Hear the other side — right to a fair hearing","explanation":"Audi alteram partem is a Latin maxim meaning 'hear the other side.' It embodies the right to a fair hearing — no person should be condemned without an opportunity to be heard.","concept_note":null},{"q_no":74,"topic":"Natural Justice","question":"'Nemo debet esse judex in propria sua causa' means:","options":{"A":"Right to a fair hearing","B":"No one shall be a judge in his own cause — Rule against bias","C":"Both parties must be heard","D":"The decision must be a speaking order"},"correct":"B","answer_text":"No one shall be a judge in his own cause — Rule against bias","explanation":"This maxim means that a person who has an interest in the outcome of a decision should not be the one to make that decision. It is the foundation of the rule against bias in natural justice.","concept_note":null},{"q_no":75,"topic":"Natural Justice","question":"Which case is regarded as the leading English authority on the rule against bias (pecuniary interest)?","options":{"A":"Ridge v. Baldwin (1964)","B":"Dimes v. Grand Junction Canal (1852)","C":"Cooper v. Wandsworth Board (1863)","D":"R v. Sussex Justices (1924)"},"correct":"B","answer_text":"Dimes v. Grand Junction Canal (1852)","explanation":"In Dimes v. Grand Junction Canal (1852), Lord Chancellor held shares in the canal company. His decree was set aside even though there was no actual bias — pecuniary interest causes automatic disqualification.","concept_note":"Types of Bias: (1) Pecuniary bias — automatic disqualification (Dimes); (2) Personal bias — some connection with a party; (3) Subject matter bias — pre-judgment; (4) Departmental bias — decision-maker is part of the same department. Test in India: 'Real danger' or 'Reasonable suspicion' of bias — A.K. Kraipak (1970)."},{"q_no":76,"topic":"Natural Justice","question":"The leading case that revived the rules of natural justice and held they apply even to administrative decisions affecting rights or legitimate expectations is:","options":{"A":"Cooper v. Wandsworth Board (1863)","B":"Ridge v. Baldwin (1964) [HL]","C":"A.K. Kraipak v. Union of India (1970)","D":"Maneka Gandhi v. Union of India (1978)"},"correct":"B","answer_text":"Ridge v. Baldwin (1964) [House of Lords]","explanation":"Before Ridge v. Baldwin (1964), natural justice was confined to strictly judicial or quasi-judicial functions. The House of Lords overturned this narrow view and held that natural justice applies wherever rights are affected.","concept_note":null},{"q_no":77,"topic":"Natural Justice","question":"In A.K. Kraipak v. Union of India (1970), the Supreme Court held that:","options":{"A":"Natural justice applies only to judicial tribunals","B":"Natural justice principles apply to administrative functions also — distinction between administrative and quasi-judicial is obsolete","C":"The selection committee was validly constituted","D":"Government servants have no right to be heard"},"correct":"B","answer_text":"Natural justice applies to administrative functions also","explanation":"In A.K. Kraipak (1970), a member of the selection committee was also a candidate. The SC held that natural justice principles apply to administrative functions as well — the boundary between judicial, quasi-judicial and administrative has become thin.","concept_note":null},{"q_no":78,"topic":"Natural Justice","question":"The doctrine of 'Legitimate Expectation' in administrative law means:","options":{"A":"A citizen can legitimately claim a Constitutional right","B":"A person has a reasonable expectation based on previous practice, promise, or policy that procedural fairness will be observed before adverse action","C":"The expectation of winning a case","D":"Government's expectation from citizens"},"correct":"B","answer_text":"Reasonable expectation that procedural fairness will be observed before adverse action","explanation":"Legitimate Expectation arises when a public authority has made a representation (by conduct, policy, or promise) that creates a reasonable expectation in a person's mind that they will be heard before being adversely affected. Leading cases: GCHQ Case (1985 UK); Navjyoti Coop. v. Union of India (1992 India).","concept_note":null},{"q_no":79,"topic":"Natural Justice","question":"'Speaking Order' requirement in natural justice means:","options":{"A":"Orders must be announced orally","B":"The decision-maker must record reasons for the decision","C":"The decision must be made in open court","D":"The affected party must be given an opportunity to speak"},"correct":"B","answer_text":"The decision-maker must record reasons for the decision — duty to give reasons","explanation":"A 'speaking order' or 'reasoned order' is one where the authority records its reasons for the decision. Leading case in India: Bhagat Raja v. Union of India (1967) — quasi-judicial orders must be reasoned orders.","concept_note":null},{"q_no":80,"topic":"Natural Justice","question":"Which of the following is NOT an element of 'audi alteram partem'?","options":{"A":"Notice of the charge/case against the party","B":"Opportunity to file a written reply","C":"Right to be represented by a lawyer in all proceedings","D":"Opportunity to present evidence"},"correct":"C","answer_text":"Right to legal representation is NOT an absolute component","explanation":"Right to legal representation is not an absolute requirement of audi alteram partem. It may or may not be required depending on the nature of proceedings and statutory provisions. The other three options are core components of the right to fair hearing.","concept_note":null},{"q_no":81,"topic":"Natural Justice","question":"The rule of natural justice can be excluded by:","options":{"A":"Express statutory provision or necessary implication","B":"Urgency or emergency situations","C":"Impracticability","D":"All of the above"},"correct":"D","answer_text":"All of the above","explanation":"Natural justice can be excluded by: (1) express statutory provision; (2) necessary implication from statute; (3) urgency/emergency where prior hearing is impossible; (4) impracticability. However, exclusion must be justified and must not violate Fundamental Rights.","concept_note":null},{"q_no":82,"topic":"Natural Justice","question":"In Gullapalli Nageswara Rao v. A.P. State Road Transport Corp. (1959), the Supreme Court held:","options":{"A":"Natural justice is not applicable to economic regulation","B":"An officer who heard objections to a scheme cannot himself sanction it — investigator cannot be adjudicator","C":"The government need not give reasons for nationalisation","D":"Tribunal decisions are final"},"correct":"B","answer_text":"Investigator cannot be adjudicator — an officer who heard objections cannot himself sanction the scheme","explanation":"In Gullapalli Nageswara Rao (1959), the SC held that the Secretary who had heard the objections to a road transport nationalization scheme could not himself sanction it — this violated natural justice as he would be judging his own hearing.","concept_note":null},{"q_no":83,"topic":"Natural Justice","question":"'Institutional bias' or 'Departmental bias' arises when:","options":{"A":"The judge personally knows the parties","B":"The whole department/institution has a pre-determined stance likely to influence the adjudicator","C":"The judge has pecuniary interest","D":"The lawyer is biased"},"correct":"B","answer_text":"The whole department/institution has a pre-determined stance likely to influence the adjudicator","explanation":"Departmental or institutional bias arises when the adjudicator belongs to the same department whose policy or decision is being challenged. The environment itself creates a bias. Discussed in Gullapalli Nageswara Rao and State of U.P. v. Mohd. Nooh (1958).","concept_note":null},{"q_no":84,"topic":"Natural Justice","question":"Can the principle of natural justice be waived?","options":{"A":"Never — it is a mandatory requirement","B":"Yes — if the party with the right knowingly and voluntarily waives it","C":"Only by Parliamentary statute","D":"Only by the Supreme Court"},"correct":"B","answer_text":"Yes — natural justice can be waived by the affected party knowingly and voluntarily","explanation":"Natural justice rights can be waived by the person entitled to them, provided the waiver is voluntary, knowing, and unambiguous. This is a well-established principle in both English and Indian administrative law.","concept_note":null},{"q_no":85,"topic":"Natural Justice","question":"The maxim 'Justice must not only be done but must also be seen to be done' is associated with:","options":{"A":"Natural justice — bias rule","B":"Res judicata","C":"Stare decisis","D":"Delegated legislation"},"correct":"A","answer_text":"Natural justice — bias rule — from R v. Sussex Justices, ex parte McCarthy (1924)","explanation":"This famous dictum was laid down by Lord Hewart CJ in R v. Sussex Justices (1924). It underpins the rule against bias — not only must actual bias be absent, but the appearance of bias must also be eliminated.","concept_note":null},{"q_no":86,"topic":"Natural Justice","question":"The doctrine of 'Post-decisional hearing' — giving opportunity to be heard after the decision — is:","options":{"A":"Completely valid and satisfies natural justice always","B":"Generally not a valid substitute for pre-decisional hearing; courts look at circumstances","C":"Prohibited by law","D":"Required in all administrative decisions"},"correct":"B","answer_text":"Generally NOT a valid substitute for pre-decisional hearing","explanation":"Post-decisional hearing is generally not an adequate substitute for a pre-decisional hearing. In Maneka Gandhi (1978), the Court held that impounding a passport without prior hearing was invalid even though subsequent remedies were available.","concept_note":null},{"q_no":87,"topic":"Judicial Review","question":"'Certiorari' is a writ that:","options":{"A":"Commands a person to do a public duty","B":"Brings up the record of a lower tribunal to a superior court to quash the decision","C":"Restrains a person from acting in a particular way","D":"Asks why a person should not be produced before a court"},"correct":"B","answer_text":"Brings up the record of a lower tribunal to quash the decision","explanation":"Certiorari is issued by a superior court to an inferior tribunal to remove proceedings and quash them if the inferior tribunal has acted without jurisdiction, in excess of jurisdiction, in violation of natural justice, or there is an error apparent on the face of the record.","concept_note":null},{"q_no":88,"topic":"Judicial Review","question":"'Mandamus' as a writ is issued when:","options":{"A":"A court certifies a question to a higher court","B":"There is an illegal detention","C":"A public authority fails to perform its public duty","D":"A decision needs to be quashed"},"correct":"C","answer_text":"A public authority fails to perform its public duty","explanation":"Mandamus (Latin: 'we command') is issued by a superior court to a public authority, official, corporation, or lower court directing them to perform a public duty which they have failed or refused to perform.","concept_note":null},{"q_no":89,"topic":"Judicial Review","question":"Under what circumstances is the writ of Habeas Corpus issued?","options":{"A":"To quash an illegal order","B":"To compel performance of a public duty","C":"To direct production of a detained person before court to examine legality of detention","D":"To restrain a court from exceeding its jurisdiction"},"correct":"C","answer_text":"To direct production of a detained person before court to examine legality of detention","explanation":"Habeas Corpus (Latin: 'you have the body') is the most important writ for protection of individual liberty. It requires the detaining authority to produce the detained person before the court so the court can determine the legality of the detention.","concept_note":null},{"q_no":90,"topic":"Judicial Review","question":"The grounds of judicial review in English law were authoritatively classified into three categories in which case?","options":{"A":"Ridge v. Baldwin (1964)","B":"Associated Provincial Picture Houses v. Wednesbury Corporation (1948)","C":"Council of Civil Service Unions v. Minister for Civil Service — GCHQ Case (1985)","D":"Anisminic v. Foreign Compensation Commission (1969)"},"correct":"C","answer_text":"GCHQ Case — Council of Civil Service Unions v. Minister for Civil Service (1985)","explanation":"Lord Diplock in the GCHQ Case (1985) classified the grounds of judicial review into three categories: (1) Illegality; (2) Irrationality (Wednesbury unreasonableness); (3) Procedural Impropriety.","concept_note":"Lord Diplock's Three Grounds (GCHQ Case, 1985): (1) Illegality — decision-maker must understand and act within the law; (2) Irrationality — decision so unreasonable no reasonable authority could have made it (Wednesbury); (3) Procedural Impropriety — failure to observe statutory procedures or natural justice. A 4th ground — Proportionality — is now recognized in EU/Human Rights contexts."},{"q_no":91,"topic":"Judicial Review","question":"'Wednesbury unreasonableness' refers to:","options":{"A":"A decision that is slightly wrong","B":"A decision so outrageous in its defiance of logic or accepted moral standards that no sensible person could have arrived at it","C":"A decision made without jurisdiction","D":"A decision against natural justice"},"correct":"B","answer_text":"A decision so outrageous that no sensible person could have arrived at it","explanation":"Wednesbury unreasonableness comes from Associated Provincial Picture Houses Ltd. v. Wednesbury Corporation [1948] 1 KB 223, where Lord Greene MR described it as a decision so unreasonable that no reasonable authority could have come to it.","concept_note":null},{"q_no":92,"topic":"Judicial Review","question":"The doctrine of 'Ultra Vires' in administrative law means:","options":{"A":"Acting within the granted powers","B":"Acting beyond the powers granted by the enabling statute","C":"Acting with malice","D":"Acting against natural justice"},"correct":"B","answer_text":"Acting beyond the powers granted by the enabling statute","explanation":"Ultra vires (Latin: 'beyond powers') means acting outside the scope of authority granted. Two types: (1) Substantive ultra vires — acting beyond the scope of powers; (2) Procedural ultra vires — failing to follow prescribed procedures.","concept_note":null},{"q_no":93,"topic":"Judicial Review","question":"'Proportionality' as a ground of judicial review requires that:","options":{"A":"The decision must be proportionate to the resources available","B":"The means adopted must be proportionate to the end sought — fair balance between individual rights and public interest","C":"Punishment must be proportionate to the offence in criminal cases only","D":"Administrative decisions must be made within a proportionate time"},"correct":"B","answer_text":"Means adopted must be proportionate to the end — fair balance between individual rights and public interest","explanation":"Proportionality requires a fair balance between the means used and the end sought. It is stricter than Wednesbury unreasonableness. Recognised in India in Om Kumar v. Union of India (2001). Courts examine whether a less restrictive means could achieve the same result.","concept_note":null},{"q_no":94,"topic":"Judicial Review","question":"Judicial review of administrative action in India is primarily based on:","options":{"A":"Articles 32 and 226 of the Constitution","B":"The Administrative Tribunals Act, 1985","C":"Article 136 SLP only","D":"Article 131"},"correct":"A","answer_text":"Articles 32 and 226 of the Constitution","explanation":"Judicial review of administrative action in India primarily flows from Articles 32 (Supreme Court) and 226 (High Courts) through the writ jurisdiction. It is a constitutional power, not merely a statutory one.","concept_note":null},{"q_no":95,"topic":"Judicial Review","question":"The doctrine of 'Legitimate Expectation' as a ground of judicial review was first clearly expounded in Indian law in:","options":{"A":"A.K. Kraipak v. Union of India","B":"Navjyoti Coop. Group Housing Society v. Union of India (1992)","C":"S.R. Bommai v. Union of India","D":"Maneka Gandhi v. Union of India"},"correct":"B","answer_text":"Navjyoti Coop. Group Housing Society v. Union of India (1992)","explanation":"The doctrine of Legitimate Expectation was clearly expounded in Indian administrative law in Navjyoti Coop. Group Housing Society v. Union of India (1992), where the SC held that a change in policy without giving an opportunity to be heard violated legitimate expectation.","concept_note":null},{"q_no":96,"topic":"Judicial Review","question":"'Mala fide' (bad faith) as a ground of judicial review implies:","options":{"A":"The authority acted with personal animosity or improper purpose","B":"The authority made a technical error","C":"The decision was unreasonable","D":"The authority had no jurisdiction"},"correct":"A","answer_text":"The authority acted with personal animosity or improper purpose","explanation":"Mala fide or bad faith as a ground of judicial review means the authority exercised its power for an improper purpose, with personal animosity, or in abuse of power. Courts are very slow to impute mala fides — it must be clearly established.","concept_note":null},{"q_no":97,"topic":"Judicial Review","question":"'Error apparent on the face of the record' as a ground of certiorari means:","options":{"A":"Any error in the decision","B":"Only an error so obvious and manifest that it does not require elaborate reasoning to detect","C":"Factual error","D":"Jurisdictional error only"},"correct":"B","answer_text":"Only an error so obvious and manifest that it requires no elaborate reasoning to detect","explanation":"Error apparent on the face of the record must be clear and manifest without requiring detailed argument or examination of evidence. Established in Syed Yakoob v. K.S. Radhakrishnan (1964 SC).","concept_note":null},{"q_no":98,"topic":"Judicial Review","question":"In Anisminic Ltd. v. Foreign Compensation Commission (1969) [HL], the House of Lords held:","options":{"A":"Natural justice cannot apply to tribunals","B":"Any error of law (not just jurisdictional error in the old technical sense) makes a decision a nullity","C":"The Commission had acted within its powers","D":"Certiorari does not lie against statutory tribunals"},"correct":"B","answer_text":"Any error of law makes a decision a nullity","explanation":"Anisminic (1969) effectively abolished the old distinction between 'jurisdictional error' (always reviewable) and 'error within jurisdiction' (not reviewable by certiorari). The HL held that any error of law goes to jurisdiction and makes the decision a nullity.","concept_note":null},{"q_no":99,"topic":"Judicial Review","question":"The 'Doctrine of Proportionality' in Indian administrative law was specifically adopted in:","options":{"A":"Maneka Gandhi v. Union of India (1978)","B":"Om Kumar v. Union of India (2001)","C":"Indian Express Newspapers v. Union of India (1985)","D":"Saraswathi v. Union of India (1999)"},"correct":"B","answer_text":"Om Kumar v. Union of India (2001)","explanation":"In Om Kumar v. Union of India (2001), the Supreme Court specifically adopted the doctrine of proportionality in Indian administrative law for reviewing punishments imposed on government servants.","concept_note":null},{"q_no":100,"topic":"Administrative Law","question":"Which Article provides for Administrative Tribunals to deal with service matters?","options":{"A":"Article 323","B":"Article 323-A","C":"Article 323-B","D":"Both B and C"},"correct":"D","answer_text":"Both 323-A (service matters) and 323-B (other matters like taxation, elections)","explanation":"Article 323-A deals with Administrative Tribunals for service matters (inserted by 42nd Amendment, 1976; operationalized by Administrative Tribunals Act, 1985). Article 323-B provides for tribunals for other matters like taxation, elections, industrial disputes, etc.","concept_note":null},{"q_no":101,"topic":"Fundamental Rights","question":"Assertion (A): Article 21 includes the right to a fair trial and speedy justice. Reason (R): In Hussainara Khatoon v. State of Bihar (1979), the SC held speedy trial is a component of Article 21.","options":{"A":"Both A and R are true and R is the correct explanation of A","B":"Both A and R are true but R is NOT the correct explanation","C":"A is true but R is false","D":"A is false but R is true"},"correct":"A","answer_text":"Both A and R are true and R is the correct explanation of A","explanation":"Article 21 has been expansively interpreted to include the right to speedy trial (Hussainara Khatoon, 1979), right to legal aid, and right to fair procedure. R correctly explains why A is true.","concept_note":null},{"q_no":102,"topic":"Union Executive","question":"Assertion (A): The President can promulgate an Ordinance under Article 123 only when both Houses of Parliament are not in session. Reason (R): An Ordinance ceases at the expiration of six weeks from the reassembly of Parliament.","options":{"A":"Both A and R are true and R is the correct explanation of A","B":"Both A and R are true but R is NOT the correct explanation","C":"A is true but R is false","D":"A is false but R is true"},"correct":"B","answer_text":"Both A and R are true but R is NOT the correct explanation of A","explanation":"A is true — Ordinance can be promulgated when at least one House of Parliament is not in session (not necessarily both). R is also true — 6 weeks maximum after reassembly. But R is the duration rule, not the explanation for when it can be issued.","concept_note":null},{"q_no":103,"topic":"Directive Principles","question":"Assertion (A): DPSPs are non-justiciable. Reason (R): They are fundamental in governance and it is the duty of the State to apply them in making laws.","options":{"A":"Both A and R are true and R is the correct explanation","B":"Both A and R are true but R is not the correct explanation of A","C":"A is true but R is false","D":"A is false but R is true"},"correct":"B","answer_text":"Both are true but R is not the correct explanation of A","explanation":"Both A (Article 37 — non-justiciable) and R (Article 37 — fundamental in governance) are true. However, R does not explain WHY they are non-justiciable. They are non-justiciable because of a deliberate constitutional design separating justiciable rights from non-justiciable policy guidelines.","concept_note":null},{"q_no":104,"topic":"Judicial Review","question":"Match the writs with their purpose: (i) Mandamus (ii) Habeas Corpus (iii) Prohibition (iv) Quo Warranto — (a) Release from illegal detention (b) Perform a public duty (c) Prevent inferior tribunal from exceeding jurisdiction (d) Question authority to hold public office","options":{"A":"i-b, ii-a, iii-c, iv-d","B":"i-a, ii-b, iii-c, iv-d","C":"i-b, ii-c, iii-a, iv-d","D":"i-d, ii-a, iii-c, iv-b"},"correct":"A","answer_text":"i-b, ii-a, iii-c, iv-d","explanation":"Mandamus (b) — compels performance of a public duty. Habeas Corpus (a) — secures release from illegal detention. Prohibition (c) — prevents inferior tribunal from exceeding jurisdiction (preventive). Quo Warranto (d) — questions by what authority a person holds a public office.","concept_note":null},{"q_no":105,"topic":"Emergency Provisions","question":"Match the Articles with their subjects: (i) Art.249 (ii) Art.352 (iii) Art.356 (iv) Art.360 — (a) Financial Emergency (b) Parliament legislates on State List in national interest (c) National Emergency (d) Failure of constitutional machinery in State","options":{"A":"i-b, ii-c, iii-d, iv-a","B":"i-c, ii-b, iii-d, iv-a","C":"i-a, ii-d, iii-c, iv-b","D":"i-b, ii-d, iii-c, iv-a"},"correct":"A","answer_text":"i-b, ii-c, iii-d, iv-a","explanation":"Article 249 (b) — Parliament legislates on State List in national interest via Rajya Sabha resolution. Article 352 (c) — National Emergency. Article 356 (d) — Failure of constitutional machinery/President's Rule. Article 360 (a) — Financial Emergency.","concept_note":null},{"q_no":106,"topic":"Fundamental Rights","question":"Which of the following is CORRECT about the 'Basic Structure Doctrine'? (i) Propounded in Kesavananda Bharati Case (1973); (ii) Limits Parliament's amending power; (iii) Federalism is a basic feature; (iv) Free and fair elections is a basic feature","options":{"A":"i and ii only","B":"i, ii and iii only","C":"i, ii, iii and iv — all four correct","D":"i and iv only"},"correct":"C","answer_text":"All four statements are correct","explanation":"All four are correct: (i) Kesavananda Bharati (1973) established basic structure; (ii) Parliament cannot amend to destroy basic structure; (iii) Federal character is a basic structure element (Kesavananda); (iv) Free and fair elections recognised as basic structure in Indira Nehru Gandhi v. Raj Narain (1975).","concept_note":null},{"q_no":107,"topic":"Fundamental Rights","question":"The 'Doctrine of Eclipse' in Constitutional Law means:","options":{"A":"A law void ab initio becomes valid retrospectively when the constitutional bar is removed","B":"A pre-constitutional law inconsistent with a Fundamental Right becomes dormant/eclipsed (not void) and revives if the inconsistency is removed","C":"A law is eclipsed by a subsequent constitutional amendment","D":"Both A and B"},"correct":"B","answer_text":"Pre-constitutional law inconsistent with FR becomes dormant/eclipsed — revives if inconsistency is removed","explanation":"The Doctrine of Eclipse applies to pre-constitutional laws. Such a law is not void ab initio — it is merely eclipsed/dormant to the extent of inconsistency. If the constitutional bar is removed (e.g., by amending the FR), the law revives. Leading case: Bhikhaji Narain Dhakras v. State of MP (1955).","concept_note":null},{"q_no":108,"topic":"Fundamental Rights","question":"The 'Doctrine of Severability' (Article 13) means:","options":{"A":"The entire Act is void if one provision violates Fundamental Rights","B":"Only the offending provision is severed and the rest remains valid, if the valid parts can stand independently","C":"The Act is suspended pending reference to a Constitutional Bench","D":"The invalid part revives after Constitutional amendment"},"correct":"B","answer_text":"Only the offending provision is severed and the rest remains valid if independent","explanation":"Under the Doctrine of Severability, only the portion of the law that violates Fundamental Rights is struck down. The rest of the law remains valid provided the valid portions are severable from the invalid ones and can stand independently. Leading case: R.M.D. Chamarbaugwala v. Union of India (1957).","concept_note":null},{"q_no":109,"topic":"Judicial Review","question":"'Res Judicata' in administrative law means:","options":{"A":"A decided question between the same parties cannot be re-agitated","B":"No one can be a judge in his own case","C":"A superior court can always review lower court decisions","D":"Natural justice must be followed"},"correct":"A","answer_text":"A decided question between the same parties cannot be re-agitated","explanation":"Res judicata (a matter already judged) means that once a matter is decided between the same parties on the same facts and the same cause of action by a competent court, it cannot be re-litigated. It applies in administrative law too.","concept_note":null},{"q_no":110,"topic":"Administrative Law","question":"Under Article 309, the conditions of service of persons serving the Union or States can be regulated by:","options":{"A":"An Act of the appropriate legislature; until such Act is made, by executive rules","B":"The President alone","C":"The Supreme Court","D":"Only by legislation"},"correct":"A","answer_text":"By Act of legislature; until then by executive rules under proviso to Article 309","explanation":"Article 309 enables the appropriate legislature (Parliament for Union; State Legislature for State) to regulate the recruitment and conditions of service. Until Parliament or the State Legislature makes such a law, the President or Governor may make rules.","concept_note":null},{"q_no":111,"topic":"Administrative Law","question":"The 'Doctrine of Pleasure' — Article 310 — means government servants hold office 'during the pleasure of the President/Governor.' This is subject to:","options":{"A":"No restriction","B":"Article 311 — procedural safeguards of inquiry before dismissal/removal/reduction in rank","C":"Article 32 alone","D":"Cabinet approval"},"correct":"B","answer_text":"Article 311 — procedural safeguards: inquiry before dismissal/removal/reduction in rank","explanation":"Article 310 establishes the doctrine of pleasure. But Article 311 provides constitutional safeguards: (1) No dismissal by an authority subordinate to the appointing authority; (2) Reasonable opportunity to show cause before dismissal, removal, or reduction in rank.","concept_note":null},{"q_no":112,"topic":"Judicial Review","question":"Which of the following cases is associated with PIL being used to enforce Fundamental Rights of disadvantaged groups?","options":{"A":"Bandhua Mukti Morcha v. Union of India (1984)","B":"M.C. Mehta v. Union of India (environmental law)","C":"Vishaka v. State of Rajasthan (1997)","D":"All of the above — PIL has been used in all these"},"correct":"D","answer_text":"All of the above","explanation":"PIL has been used in all these landmark cases: Bandhua Mukti Morcha (1984) — bonded labour; M.C. Mehta — environmental protection; Vishaka (1997) — sexual harassment at workplace. PIL through Articles 32/226 has become a powerful tool for social justice.","concept_note":null}]},{"set_id":2,"set_title":"Second MCQ Bank — Emergency, Governor, Parliament, Admin Law Deep Dive","questions":[{"q_no":1,"topic":"Emergency Provisions","question":"Under the original Constitution, a National Emergency could be proclaimed on the ground of 'internal disturbance.' Which Amendment replaced this with 'armed rebellion'?","options":{"A":"42nd Amendment, 1976","B":"44th Amendment, 1978","C":"43rd Amendment, 1977","D":"45th Amendment, 1980"},"correct":"B","answer_text":"44th Amendment, 1978","explanation":"The 44th Amendment (1978) substituted 'armed rebellion' for 'internal disturbance' in Article 352. This made it harder to impose emergency for mere civil unrest — a direct response to the misuse during the 1975 Emergency.","concept_note":null},{"q_no":2,"topic":"Emergency Provisions","question":"The National Emergency of 1975 was proclaimed on the ground of:","options":{"A":"External aggression by Pakistan","B":"Armed rebellion in Punjab","C":"Internal disturbance — the first and only such proclamation on internal grounds","D":"Threat of war with China"},"correct":"C","answer_text":"Internal disturbance (June 25, 1975 — the only proclamation on internal grounds)","explanation":"The National Emergency proclaimed on June 25, 1975 was the only emergency declared on the ground of internal disturbance (now 'armed rebellion'). Earlier emergencies (1962, 1965, 1971) were on grounds of external aggression/war.","concept_note":null},{"q_no":3,"topic":"Emergency Provisions","question":"Under Article 352(3), a proclamation of National Emergency must be approved by each House of Parliament by:","options":{"A":"Simple majority","B":"Absolute majority of total membership of each House","C":"Special majority — not less than 2/3 of members present and voting AND a majority of total membership","D":"Unanimous vote"},"correct"
