:"C","answer_text":"Special majority — 2/3 of members present and voting AND majority of total membership","explanation":"Article 352(6) requires special majority for approval of National Emergency proclamation: not less than two-thirds of members of each House present and voting, which must also be a majority of the total membership of each House.","concept_note":null},{"q_no":4,"topic":"Emergency Provisions","question":"The maximum initial period for which a National Emergency can operate without Parliamentary approval is:","options":{"A":"15 days","B":"One month","C":"Two months","D":"Six months"},"correct":"B","answer_text":"One month — Article 352(4)","explanation":"Under Article 352(4), the proclamation of National Emergency must be laid before each House of Parliament and ceases to operate at the expiration of one month unless approved before that. After approval, it continues for 6 months.","concept_note":null},{"q_no":5,"topic":"Emergency Provisions","question":"Once approved, a National Emergency continues for what period and how is it renewed?","options":{"A":"One year without renewal","B":"6 months — must be renewed every 6 months by special majority","C":"3 months at a time","D":"Until revoked, with no renewal requirement"},"correct":"B","answer_text":"6 months — renewed every 6 months by special majority","explanation":"After initial Parliamentary approval, the National Emergency continues for 6 months. For each subsequent 6-month period, fresh approval by special majority is required.","concept_note":null},{"q_no":6,"topic":"Emergency Provisions","question":"A National Emergency can be revoked by the President:","options":{"A":"Only with Parliamentary approval","B":"On his own initiative OR on a resolution passed by Lok Sabha by simple majority — Article 352(7) & (8)","C":"Only by Cabinet recommendation","D":"By the Supreme Court order"},"correct":"B","answer_text":"On own initiative OR on Lok Sabha simple majority resolution — Article 352(7) & (8)","explanation":"Under Article 352(8), if a notice is signed by not less than 1/10 of total members of Lok Sabha, a special sitting must be held within 14 days. If the House passes a resolution by simple majority disapproving the Emergency, the President must revoke it. This is the only instance where Lok Sabha alone can act constitutionally.","concept_note":"Lok Sabha Revocation: Article 352(8) gives the Lok Sabha alone the unique power to disapprove a National Emergency by simple majority — this is an exception to the general rule that both Houses must act together on constitutional matters."},{"q_no":7,"topic":"Emergency Provisions","question":"During a National Emergency (war/external aggression), Article 358 suspends Article 19 rights:","options":{"A":"On Presidential order specifying which rights","B":"Automatically and absolutely for the duration","C":"Automatically but only as regards laws inconsistent with Article 19 made during Emergency","D":"Only in affected border states"},"correct":"C","answer_text":"Automatically but only for laws enacted during the Emergency — not pre-Emergency laws","explanation":"Article 358 operates automatically during war/external aggression emergency but only saves laws MADE DURING the Emergency. Pre-existing laws that violate Article 19 are not automatically saved by Article 358.","concept_note":null},{"q_no":8,"topic":"Emergency Provisions","question":"Article 359 differs from Article 358 in that:","options":{"A":"Article 359 relates to financial emergency only","B":"Article 359 requires a Presidential Order specifying which FRs (other than Arts. 20 & 21) can be suspended — it is not automatic","C":"Article 359 is permanent","D":"Article 359 applies only to internal emergency"},"correct":"B","answer_text":"Article 359 requires a Presidential Order — it is NOT automatic like Article 358","explanation":"Article 358 operates automatically (only for Art. 19, only during war/external aggression). Article 359 requires the President to issue an Order specifying which Fundamental Rights (excluding Arts. 20 & 21) shall not be enforceable. It is discretionary and specific.","concept_note":null},{"q_no":9,"topic":"Emergency Provisions","question":"Which Articles of the Constitution CANNOT be suspended even during National Emergency by Presidential Order under Article 359?","options":{"A":"Articles 14 and 15","B":"Articles 19 and 21","C":"Articles 20 and 21","D":"Articles 21 and 22"},"correct":"C","answer_text":"Articles 20 and 21 — made non-suspendable by 44th Amendment","explanation":"The 44th Amendment, 1978 amended Article 359 to exclude Articles 20 and 21 from the President's power to suspend enforcement of Fundamental Rights during Emergency. Articles 20 (protection from ex post facto laws, double jeopardy, self-incrimination) and 21 (right to life) can NEVER be suspended.","concept_note":null},{"q_no":10,"topic":"Fundamental Rights","question":"Article 20 protects against:","options":{"A":"Arbitrary detention","B":"Ex post facto laws, double jeopardy, and self-incrimination","C":"Forced labour","D":"Custodial torture"},"correct":"B","answer_text":"Ex post facto laws, double jeopardy, and self-incrimination","explanation":"Article 20 provides triple protection: (1) No ex post facto criminal law — no person convicted of offence which was not an offence when committed; (2) No double jeopardy — no person prosecuted and punished more than once for the same offence; (3) No self-incrimination — no person compelled to be a witness against himself.","concept_note":null},{"q_no":11,"topic":"Emergency Provisions","question":"During a National Emergency, Parliament acquires power to legislate on:","options":{"A":"Only Union List subjects","B":"Both Union List and State List subjects — Article 250","C":"All three Lists with extra powers","D":"Residuary subjects only"},"correct":"B","answer_text":"Both Union List and State List subjects — Article 250","explanation":"Under Article 250, while a proclamation of National Emergency is in operation, Parliament has power to make laws with respect to any matter in the State List. This extends Parliamentary legislative power significantly during Emergency.","concept_note":null},{"q_no":12,"topic":"Emergency Provisions","question":"During National Emergency, the President can modify constitutional provisions relating to distribution of revenues under:","options":{"A":"Article 268","B":"Article 280","C":"Article 354","D":"Article 360"},"correct":"C","answer_text":"Article 354","explanation":"Article 354 enables the President to direct that all or any provisions of Articles 268–279 (dealing with distribution of revenues between Union and States) shall apply with modifications or exceptions during a National Emergency.","concept_note":null},{"q_no":13,"topic":"Emergency Provisions","question":"The maximum period for which President's Rule can operate without fresh Parliamentary approval is:","options":{"A":"2 months","B":"6 months","C":"1 year","D":"3 years"},"correct":"B","answer_text":"6 months (initial 2 months for Parliamentary approval + each renewal for 6 months)","explanation":"A proclamation under Article 356 must be approved by Parliament within 2 months. Once approved, it operates for 6 months. It can be renewed every 6 months up to a maximum of 3 years (beyond 1 year only with special conditions under Article 356(4) & (5)).","concept_note":null},{"q_no":14,"topic":"Emergency Provisions","question":"Under Article 356, President's Rule beyond ONE YEAR requires, in addition to Parliamentary approval:","options":{"A":"A declaration of National Emergency in the whole of India or the concerned State","B":"A recommendation by the Election Commission that elections cannot be held in that State","C":"Both (A) or (B) — either condition must be satisfied","D":"Supreme Court certification"},"correct":"C","answer_text":"Either (A) — National Emergency declared — OR (B) — ECI recommendation that elections cannot be held","explanation":"Article 356(4) and (5) provide that beyond one year, President's Rule can only be extended if either: (a) a National Emergency is in operation in the whole or part of the concerned State; OR (b) the Election Commission certifies that elections to the Legislative Assembly of the State cannot be held.","concept_note":null},{"q_no":15,"topic":"Emergency Provisions","question":"The absolute maximum period for which President's Rule can be imposed in a State is:","options":{"A":"1 year","B":"2 years","C":"3 years","D":"5 years"},"correct":"C","answer_text":"3 years","explanation":"President's Rule under Article 356 can be imposed for a maximum of 3 years. After 3 years, fresh elections must be held. Extension beyond 1 year requires special conditions under Article 356(4) & (5).","concept_note":null},{"q_no":16,"topic":"Emergency Provisions","question":"In S.R. Bommai v. Union of India (1994), the Supreme Court held that the Proclamation under Article 356 is subject to judicial review on which ground?","options":{"A":"It violates Directive Principles","B":"Mala fide exercise or based on wholly irrelevant grounds — courts can examine the material","C":"It is void unless confirmed by Supreme Court","D":"President has no discretion in issuing it"},"correct":"B","answer_text":"Mala fide exercise or based on wholly irrelevant grounds — courts can examine the material","explanation":"S.R. Bommai (1994) — 9-judge bench held: (1) Art. 356 proclamation is justiciable; (2) President cannot dissolve Assembly until Parliament approves (suspended animation); (3) Secularism is basic structure; (4) Floor of the House is the sole test of majority; (5) Courts can examine whether material before President was relevant.","concept_note":"S.R. Bommai (1994) is one of the most important cases on federalism. It effectively curtailed arbitrary use of Article 356 and upheld federalism as a basic structure of the Constitution."},{"q_no":17,"topic":"Emergency Provisions","question":"'Suspended animation' of State Legislative Assembly during President's Rule means:","options":{"A":"The Assembly is dissolved immediately","B":"The Assembly is dissolved after 6 months","C":"The Assembly is neither dissolved nor allowed to function — kept in suspended state pending Parliamentary approval","D":"The Assembly is reconstituted"},"correct":"C","answer_text":"Assembly is neither dissolved nor allowed to function — held in suspended animation","explanation":"S.R. Bommai held that until Parliament approves the proclamation under Article 356, the President cannot dissolve the State Legislative Assembly. It is put in 'suspended animation' — neither dissolved nor operative. If Parliament disapproves, the Assembly revives.","concept_note":null},{"q_no":18,"topic":"Emergency Provisions","question":"Financial Emergency under Article 360 can be proclaimed when:","options":{"A":"The financial stability of India or any part thereof is threatened","B":"A State refuses to pay taxes","C":"There is a balance of payments crisis","D":"GDP falls below a threshold"},"correct":"A","answer_text":"The financial stability or credit of India or any part is threatened","explanation":"Article 360 provides that the President may proclaim a Financial Emergency if he is satisfied that the financial stability or credit of India or of any part of the territory thereof is threatened.","concept_note":null},{"q_no":19,"topic":"Emergency Provisions","question":"During Financial Emergency, the President can direct reduction of salaries and allowances of:","options":{"A":"All government servants including Supreme Court and High Court judges","B":"Only State employees","C":"Only non-judicial government servants","D":"Only Union government employees"},"correct":"A","answer_text":"All government servants including Supreme Court and High Court judges — Article 360(4)","explanation":"Article 360(4)(b) uniquely allows reduction of salaries and allowances of all persons serving in connection with the affairs of the Union including the judges of the Supreme Court and High Courts during Financial Emergency. Financial Emergency has never been proclaimed in India.","concept_note":null},{"q_no":20,"topic":"Emergency Provisions","question":"Under Article 356, which of the following powers does the President NOT acquire during President's Rule?","options":{"A":"Power to assume functions of State government","B":"Power to declare that Parliament can legislate on State List subjects","C":"Power to dissolve the High Court of the State","D":"Power to suspend constitutional provisions relating to any body in the State"},"correct":"C","answer_text":"Power to dissolve the High Court — High Courts are immune from Article 356","explanation":"During President's Rule, the President takes over the executive functions of the State government and Parliament can legislate on State subjects. However, the High Courts continue to function — they are constitutional courts established under Articles 214-231 and are not affected by Article 356.","concept_note":null},{"q_no":21,"topic":"Governor","question":"The Governor is appointed by the President under Article 155. The Governor's term of office is:","options":{"A":"5 years — fixed and irremovable","B":"5 years or during the pleasure of the President — whichever is earlier","C":"6 years","D":"Co-terminus with the State government"},"correct":"B","answer_text":"5 years OR pleasure of the President — Article 156","explanation":"Article 156(1) provides that the Governor shall hold office during the pleasure of the President. Article 156(3) provides that the Governor shall hold office for a term of 5 years from the date of entering upon office — subject to the pleasure of the President.","concept_note":null},{"q_no":22,"topic":"Governor","question":"Which of the following is a discretionary power of the Governor NOT requiring Council of Ministers' advice?","options":{"A":"Summoning the State Legislature","B":"Giving assent to a Bill","C":"Reserving a Bill for the consideration of the President — Article 200","D":"Appointment of Chief Minister when no party has clear majority"},"correct":"D","answer_text":"Appointment of Chief Minister when no party has clear majority","explanation":"The Governor's discretionary powers include: (1) Appointment of CM when no clear majority; (2) Dismissal of CoM which has lost majority but refuses to resign; (3) Dissolution of State Assembly in certain situations; (4) Reservation of Bills; (5) Seeking information from CM under Article 167. All others require CoM advice.","concept_note":"Governor's Discretionary Powers (Article 163(2)): These are exercised without CoM advice: Appointment of CM when no clear majority, Dismissal of CoM that has lost majority, Dissolution of Assembly (contested), Reservation of Bills for Presidential consideration, Seeking information from CM (Art. 167), Sending Art. 356 report."},{"q_no":23,"topic":"Governor","question":"Under Article 167, the Chief Minister is under a duty to:","options":{"A":"Report all Cabinet decisions to the President","B":"Communicate to the Governor all decisions of the Council of Ministers and proposals for legislation","C":"Seek Governor's prior approval for all Cabinet decisions","D":"Report Cabinet decisions to Parliament"},"correct":"B","answer_text":"Communicate to the Governor all decisions of Council of Ministers and proposals for legislation","explanation":"Article 167 imposes three duties on the Chief Minister: (1) to communicate to the Governor all decisions of CoM relating to administration of the State; (2) to furnish information relating to administration of the State and proposals for legislation as the Governor may call for; (3) if the Governor requires, to submit for consideration of CoM any matter on which a decision has been taken by a Minister.","concept_note":null},{"q_no":24,"topic":"Governor","question":"Under Article 200, can the Governor give assent, withhold assent, or return a Bill passed by the State Legislature?","options":{"A":"No — must always give assent","B":"Yes — Governor may assent, withhold, or return (non-money bill) for reconsideration; if re-passed, must give assent","C":"Yes — Governor can withhold assent permanently","D":"Only Money Bills can be returned"},"correct":"B","answer_text":"Governor may assent, withhold, or return — if re-passed, must give assent","explanation":"Article 200 gives the Governor four options: (1) give assent; (2) withhold assent; (3) return (non-Money Bill) for reconsideration; (4) reserve for President's consideration. Crucially, if the State Legislature re-passes the Bill with or without amendments, the Governor MUST give assent.","concept_note":null},{"q_no":25,"topic":"Governor","question":"When a Governor reserves a Bill for the President's consideration under Article 200, the President under Article 201 may:","options":{"A":"Give or withhold assent only","B":"Give assent, withhold assent, or direct the Governor to return it for reconsideration","C":"Return it; if re-passed, President must assent","D":"Both B and C — President has wider discretion than Governor"},"correct":"D","answer_text":"President has full discretion — wider than Governor's. If returned and re-passed, President is NOT bound to assent","explanation":"Under Article 201, the President has full discretion — he may give assent, withhold assent, or direct the Governor to return the Bill for reconsideration. Unlike the Governor (who MUST assent if a Bill is re-passed), the President is NOT bound to assent even if the State Legislature re-passes it.","concept_note":null},{"q_no":26,"topic":"Governor","question":"Under Article 213, the Governor can promulgate Ordinances when:","options":{"A":"The State Legislature is not in session and immediate action is necessary","B":"State Legislature is in recess only","C":"There is a law and order situation only","D":"The Governor deems it fit at any time"},"correct":"A","answer_text":"Legislature not in session AND immediate action necessary","explanation":"Article 213 empowers the Governor to promulgate Ordinances when the State Legislature is not in session (or both Houses of a bicameral legislature) and the Governor is satisfied that circumstances exist that render immediate action necessary.","concept_note":null},{"q_no":27,"topic":"Governor","question":"An Ordinance promulgated by the Governor ceases to operate if:","options":{"A":"Not approved by the State Legislature within 6 weeks of its reassembly","B":"A resolution disapproving it is passed by either House","C":"Both A and B, or if the Governor revokes it","D":"Only if the Governor revokes it"},"correct":"C","answer_text":"All three scenarios under Article 213(2): expiry without approval, disapproving resolution, or revocation","explanation":"Under Article 213(2), an Ordinance ceases to operate: (1) at the expiry of 6 weeks after reassembly of the Legislature; (2) if before that, a resolution disapproving it is passed; (3) if the Governor withdraws it at any time.","concept_note":null},{"q_no":28,"topic":"Governor","question":"The Governor's pardoning power under Article 161 versus the President's power under Article 72 — which statement is CORRECT?","options":{"A":"Governor's power extends to sentences of death awarded under State laws","B":"Governor CANNOT pardon a death sentence — that is exclusively President's power","C":"Both have identical pardoning powers","D":"Governor pardons all offences including military offences"},"correct":"B","answer_text":"Governor CANNOT pardon a death sentence — exclusively President's power under Art. 72","explanation":"Article 161 gives the Governor power to grant pardons for offences against any law relating to a matter to which the executive power of the State extends. Article 72 gives the President the power to pardon death sentences, court martial offences, and offences against Union laws. Governor has NO power over death sentences.","concept_note":null},{"q_no":29,"topic":"Governor","question":"In Shamsher Singh v. State of Punjab (1974), the Supreme Court held on the role of the Governor that:","options":{"A":"The Governor acts entirely on personal discretion in all matters","B":"The Governor, like the President, is a constitutional head who acts on CoM advice in all matters except where Constitution expressly provides for discretion","C":"The Governor can appoint and dismiss Ministers independently","D":"The Governor has overriding power over the State Council of Ministers"},"correct":"B","answer_text":"Governor is a constitutional head who acts on CoM advice except where Constitution expressly provides for discretion","explanation":"Shamsher Singh v. State of Punjab (1974) — 7-judge bench — held that both the President and Governor are constitutional heads bound by the advice of the Council of Ministers except where the Constitution expressly confers discretionary powers. This is the foundational case on constitutional conventions regarding executive heads.","concept_note":null},{"q_no":30,"topic":"Governor","question":"The Governor's report recommending imposition of President's Rule under Article 356 is:","options":{"A":"Binding on the President","B":"Not binding — President acts on Union Cabinet's advice, not solely on Governor's report","C":"Subject to Rajya Sabha approval first","D":"Final and conclusive"},"correct":"B","answer_text":"Not binding — President acts on Union Cabinet's advice","explanation":"The Governor's report is the 'occasion' for invoking Article 356, but the decision is made by the Union Cabinet and the President acts on Cabinet's advice. The President is not bound by the Governor's report. S.R. Bommai held that the courts can examine the material on which President was satisfied.","concept_note":null},{"q_no":31,"topic":"Governor","question":"A person to be appointed as Governor must satisfy which qualifications?","options":{"A":"Be a citizen of India aged not less than 35 years","B":"Be a citizen of India aged not less than 30 years","C":"Be a retired judge of the Supreme Court","D":"Be nominated by the concerned State Legislature"},"correct":"A","answer_text":"Citizen of India, not less than 35 years — Article 157","explanation":"Article 157 prescribes that a person shall not be eligible for appointment as Governor unless he is a citizen of India and has completed the age of 35 years. Article 158 adds that he must not be a member of either House of Parliament or State Legislature and must not hold any office of profit.","concept_note":null},{"q_no":32,"topic":"Governor","question":"The Governor enjoys personal immunity from legal proceedings under Article 361. This immunity covers:","options":{"A":"Official acts AND personal acts during tenure — complete immunity","B":"Only official acts done in exercise of powers and duties","C":"Only criminal proceedings","D":"For 2 years after leaving office"},"correct":"A","answer_text":"Complete immunity during tenure — both official and personal acts; no proceedings without 2 months notice for civil","explanation":"Article 361 provides: (1) The President/Governor shall not be answerable to any court for the exercise of his powers; (2) No criminal proceedings whatsoever shall be instituted against them during their tenure; (3) No civil proceedings for acts done in personal capacity without 2 months' notice.","concept_note":null},{"q_no":33,"topic":"Governor","question":"In Rameshwar Prasad v. Union of India (2006), the Supreme Court:","options":{"A":"Upheld the dissolution of Bihar Assembly by the Governor","B":"Struck down the premature dissolution of Bihar Assembly by the Governor as mala fide","C":"Held the Governor's action was valid but ordered fresh elections","D":"Held that the Governor can dissolve Assembly without any reason"},"correct":"B","answer_text":"Struck down the premature dissolution of Bihar Assembly by Governor as mala fide","explanation":"In Rameshwar Prasad v. Union of India (2006), the SC struck down the dissolution of the Bihar Legislative Assembly before its first session as unconstitutional and mala fide. The Governor had acted on incorrect advice and in a politically motivated manner.","concept_note":null},{"q_no":34,"topic":"Governor","question":"In B.P. Singhal v. Union of India (2010), the Supreme Court held regarding removal of Governors:","options":{"A":"The President can remove a Governor at will for any reason","B":"The power to remove a Governor cannot be exercised arbitrarily, capriciously, or for extraneous reasons — Governor must be given opportunity to be heard","C":"A Governor cannot be removed before 5 years","D":"Removal of Governor requires Parliamentary approval"},"correct":"B","answer_text":"Removal power cannot be exercised arbitrarily — cannot be for extraneous reasons","explanation":"In B.P. Singhal v. Union of India (2010), the SC held that while the President can remove a Governor under Article 156(1) (pleasure doctrine), this power cannot be exercised arbitrarily, capriciously or for political reasons. The Governor must be given an opportunity to present their case.","concept_note":null},{"q_no":35,"topic":"Union Executive","question":"Under Article 111, if the President returns a Bill to Parliament and Parliament re-passes it with or without amendment, the President:","options":{"A":"Can withhold assent again","B":"Shall NOT withhold assent — must sign the Bill","C":"Can reserve it for the Supreme Court's opinion","D":"Can dissolve Parliament"},"correct":"B","answer_text":"Shall NOT withhold assent — must sign the Bill","explanation":"Article 111 provides that if the Bill is re-passed by both Houses with or without amendments, the President shall not withhold assent. This provision makes the President's veto a suspensive veto, not an absolute veto.","concept_note":null},{"q_no":36,"topic":"Union Executive","question":"The Vice President of India is elected by:","options":{"A":"Same electoral college as President","B":"Elected members of both Houses of Parliament","C":"Members of both Houses of Parliament — elected AND nominated","D":"Elected members of Rajya Sabha only"},"correct":"C","answer_text":"Members of both Houses of Parliament — elected AND nominated — Article 66","explanation":"Under Article 66, the Vice President is elected by the members of an electoral college consisting of members of both Houses of Parliament — both elected AND nominated members. This is broader than the President's electoral college which includes only elected members.","concept_note":null},{"q_no":37,"topic":"Union Executive","question":"The Vice President acts as the ex-officio Chairman of which House?","options":{"A":"Lok Sabha","B":"Rajya Sabha","C":"Both Houses on alternate days","D":"Neither — only when President is absent"},"correct":"B","answer_text":"Rajya Sabha — Article 64","explanation":"Article 64 provides that the Vice-President shall be ex-officio Chairman of the Council of States (Rajya Sabha). The Speaker is the presiding officer of the Lok Sabha.","concept_note":null},{"q_no":38,"topic":"Union Executive","question":"Under Article 65, the Vice President acts as President when:","options":{"A":"The Prime Minister is absent","B":"A vacancy arises in the office of the President or the President is unable to discharge functions","C":"The Speaker so directs","D":"Parliament passes a resolution"},"correct":"B","answer_text":"When vacancy arises in President's office or President is unable to discharge functions — Article 65","explanation":"Article 65(1) — VP discharges functions of President during casual vacancies. Article 65(2) — VP acts as President during absence/inability of the President. The VP can act only until the President resumes duty or a new President is elected.","concept_note":null},{"q_no":39,"topic":"Union Executive","question":"The President of India can seek the advisory opinion of the Supreme Court under:","options":{"A":"Article 131","B":"Article 136","C":"Article 143","D":"Article 141"},"correct":"C","answer_text":"Article 143 — Presidential Reference / Advisory Jurisdiction","explanation":"Article 143 empowers the President to refer a question of law or fact of public importance to the Supreme Court for its advisory opinion. The SC's opinion is advisory and not binding on the President, but has great persuasive value.","concept_note":null},{"q_no":40,"topic":"Union Executive","question":"Under Article 72, the President's pardoning power extends to:","options":{"A":"Cases involving offences against Union laws and death sentences","B":"All cases of conviction including State law offences","C":"Only Supreme Court convicted persons","D":"Only cases where appeal is pending"},"correct":"A","answer_text":"Union law offences, court martial cases, and death sentences","explanation":"Article 72 gives the President power to grant pardon, reprieve, respite, remission, or commutation of punishment to persons convicted of: (1) offences against Union laws; (2) offences by court martial; (3) all sentences of death. The Governor's pardoning power (Art. 161) covers State law offences but NOT death sentences or court martial.","concept_note":null},{"q_no":41,"topic":"Parliament","question":"The maximum strength of the Lok Sabha after the 104th Constitutional Amendment Act, 2020 is:","options":{"A":"552 (530 + 20 + 2 Anglo-Indians)","B":"543 elected members only","C":"550 members","D":"545 members"},"correct":"B","answer_text":"543 elected members — 104th Amendment abolished Anglo-Indian nominated seats","explanation":"The 104th Constitutional Amendment Act, 2020 abolished the provision for nomination of Anglo-Indian members to the Lok Sabha and State Legislative Assemblies. The maximum strength of Lok Sabha is now 543 elected members.","concept_note":null},{"q_no":42,"topic":"Parliament","question":"The maximum strength of the Rajya Sabha is:","options":{"A":"238 elected + 12 nominated = 250","B":"250 elected + 12 nominated = 262","C":"233 elected + 12 nominated = 245","D":"200 + 12 = 212"},"correct":"A","answer_text":"238 + 12 = 250 — Article 80","explanation":"Article 80 provides that the Council of States (Rajya Sabha) shall consist of not more than 238 representatives of States and Union Territories (elected) and 12 nominated by the President for their expertise in literature, science, art, and social service. Maximum = 250.","concept_note":null},{"q_no":43,"topic":"Parliament","question":"Under Article 110, a Bill is a Money Bill if it contains ONLY provisions dealing with:","options":{"A":"Imposition, abolition, remission, alteration, or regulation of any tax","B":"Appropriation of moneys from the Consolidated Fund","C":"Borrowing of money by the Government","D":"All of the above among other specified matters in Art. 110(1)"},"correct":"D","answer_text":"All of the above — Article 110(1)(a) to (g) specifies the matters","explanation":"Article 110(1) defines a Money Bill as a Bill containing ONLY provisions dealing with matters specified in clauses (a) to (g), including: (a) imposition/abolition/remission/alteration/regulation of tax; (b) regulation of borrowing; (c) custody of Consolidated Fund; (d) appropriation from Consolidated Fund; (e) supplementary expenditure; (f) audit accounts; (g) any incidental matter.","concept_note":null},{"q_no":44,"topic":"Parliament","question":"A Money Bill can be introduced only in:","options":{"A":"Rajya Sabha","B":"Lok Sabha — Article 109","C":"Either House","D":"A joint sitting of Parliament"},"correct":"B","answer_text":"Lok Sabha only — Article 109","explanation":"Article 109 provides that a Money Bill shall not be introduced in the Council of States (Rajya Sabha). It must be introduced only in the Lok Sabha. The Rajya Sabha can only make recommendations on a Money Bill within 14 days — Lok Sabha may accept or reject them.","concept_note":null},{"q_no":45,"topic":"Parliament","question":"Parliamentary privilege under Article 105 includes:","options":{"A":"Freedom of speech in Parliament","B":"Right not to be arrested in civil cases during session and 40 days before/after","C":"Exemption from jury service","D":"Both A and B"},"correct":"D","answer_text":"Both A and B","explanation":"Article 105 privileges include: (1) Freedom of speech in Parliament — MPs cannot be sued for anything said in Parliament; (2) No arrest in civil cases during session + 40 days before and after. Key case: Sita Soren v. Union of India (2024) — 7-judge bench held that bribe-taking MPs have NO immunity under Article 105, overruling P.V. Narasimha Rao (1998).","concept_note":"Parliamentary Privileges: Article 105(2) — no Member liable for anything said or vote given in Parliament. The court cannot question Parliamentary proceedings. Sita Soren v. Union of India (2024) is the latest landmark — MPs who take bribes to vote are NOT protected."},{"q_no":46,"topic":"Parliament","question":"A joint sitting of both Houses under Article 108 CANNOT be convened for which Bills?","options":{"A":"Money Bills and Constitutional Amendment Bills","B":"Only Constitutional Amendment Bills","C":"Financial Bills","D":"Ordinary Bills only"},"correct":"A","answer_text":"Money Bills (Lok Sabha's exclusive domain) AND Constitutional Amendment Bills (Art. 368 — each House must pass separately)","explanation":"Joint sitting under Article 108 is only for ordinary Bills on which there is a deadlock. Money Bills cannot go to joint sitting (they are exclusively Lok Sabha's domain). Constitutional Amendment Bills under Article 368 must be passed by each House separately by special majority — no joint sitting.","concept_note":null},{"q_no":47,"topic":"Parliament","question":"The 'Anti-Defection Law' is contained in which Schedule of the Constitution?","options":{"A":"Eighth Schedule","B":"Ninth Schedule","C":"Tenth Schedule","D":"Eleventh Schedule"},"correct":"C","answer_text":"Tenth Schedule — inserted by 52nd Amendment, 1985","explanation":"The Tenth Schedule was inserted by the 52nd Constitutional Amendment Act, 1985. It provides for disqualification of members on grounds of defection. The 91st Amendment (2003) removed the 'split' exception, retaining only 'merger' (2/3 members joining another party).","concept_note":null},{"q_no":48,"topic":"Parliament","question":"Under the Tenth Schedule, a Member of the Legislature is disqualified for defection if:","options":{"A":"He votes against his party's direction on any vote","B":"He voluntarily gives up membership of his political party OR votes contrary to party direction without prior permission and without being condoned within 15 days","C":"He is absent during any vote","D":"He criticizes his party leader publicly"},"correct":"B","answer_text":"Voluntarily gives up membership OR votes contrary to party whip without permission/condonation within 15 days","explanation":"Under the Tenth Schedule, a member is disqualified if: (1) he voluntarily gives up membership of his political party; (2) he votes or abstains in contravention of any direction issued by his party without prior permission and the party has not condoned it within 15 days.","concept_note":null},{"q_no":49,"topic":"Parliament","question":"The Ninth Schedule of the Constitution was introduced by which Amendment and for what purpose?","options":{"A":"Original Constitution — to protect land reform laws","B":"First Constitutional Amendment, 1951 — to protect land reform laws from Fundamental Rights challenge","C":"42nd Amendment, 1976","D":"44th Amendment, 1978"},"correct":"B","answer_text":"First Constitutional Amendment, 1951 — to protect land reform laws from FR challenge","explanation":"The Ninth Schedule was inserted by the Constitution (First Amendment) Act, 1951 to protect certain land reform laws from being challenged on the ground of violation of Fundamental Rights. Key case: I.R. Coelho v. State of Tamil Nadu (2007) — laws in 9th Schedule after April 24, 1973 (Kesavananda) can be challenged if they violate basic structure.","concept_note":null},{"q_no":50,"topic":"Parliament","question":"Under Article 368, which constitutional provisions require ratification by not less than half of the State Legislatures?","options":{"A":"Fundamental Rights provisions","B":"Federal provisions — Art. 54, 55, 73, 162, Seventh Schedule, representation of States in Parliament, Art. 368 itself","C":"All constitutional amendments","D":"Directive Principles provisions"},"correct":"B","answer_text":"Federal provisions — those affecting the Union-State relationship require State ratification","explanation":"Article 368 provides three categories of amendment: (1) Simple majority — matters like creation of new States; (2) Special majority (2/3 + majority of total) — most provisions; (3) Special majority + ratification by not less than half of State Legislatures — federal provisions affecting Centre-State relations.","concept_note":null},{"q_no":51,"topic":"Union-State Relations","question":"The 'Doctrine of Occupied Field' in legislative relations means:","options":{"A":"When Parliament legislates on a Concurrent List subject, the State law is automatically repealed","B":"When Parliament intends to cover the entire field on a Concurrent List subject, there is no scope for State legislation","C":"States cannot legislate at all on Concurrent subjects","D":"Only Union can occupy Concurrent List"},"correct":"B","answer_text":"When Parliament intends to cover the entire field, there is no scope for State legislation on that subject","explanation":"The Doctrine of Occupied Field operates under Article 254. When Parliament's law is intended to be exhaustive and covers the entire field of a Concurrent List subject, a State law on the same subject is repugnant to the extent it encroaches on the occupied field.","concept_note":null},{"q_no":52,"topic":"Union-State Relations","question":"Under Article 262, Parliament may by law provide that neither the Supreme Court nor any other court shall exercise jurisdiction in respect of:","options":{"A":"River water pollution disputes","B":"Inter-State water disputes","C":"Maritime boundary disputes","D":"Interstate electricity disputes"},"correct":"B","answer_text":"Inter-State water disputes — Supreme Court jurisdiction excluded","explanation":"Article 262 enables Parliament to provide by law for the adjudication of disputes relating to the waters of inter-State rivers and river valleys, and to exclude the jurisdiction of the Supreme Court. The Inter-State Water Disputes Act, 1956 creates specific tribunals for this purpose.","concept_note":null},{"q_no":53,"topic":"Union-State Relations","question":"The Sarkaria Commission (1988) on Centre-State relations recommended:","options":{"A":"Abolition of Inter-State Council","B":"Inter-State Council should be revived and made a permanent body for Union-State coordination","C":"The Governor's role should be increased","D":"Finance Commission recommendations should be made binding"},"correct":"B","answer_text":"Revival and permanent establishment of Inter-State Council for Union-State coordination","explanation":"The Sarkaria Commission (1988) made comprehensive recommendations on Centre-State relations including: revival of Inter-State Council; restraint in use of Article 356; appointment of persons with standing in State as Governor; Governor to follow conventions. The Punchhi Commission (2010) also made similar recommendations.","concept_note":null},{"q_no":54,"topic":"Union-State Relations","question":"Under Article 365, if any State fails to comply with Union directions, the President may treat it as:","options":{"A":"Financial Emergency","B":"A breakdown of constitutional machinery — triggering Article 356","C":"Suspension of State Legislature","D":"Governor's Rule"},"correct":"B","answer_text":"A breakdown of constitutional machinery — basis for Article 356","explanation":"Article 365 provides that where any State has failed to comply with or give effect to any direction given in the exercise of the executive power of the Union, it shall be lawful for the President to hold that a situation has arisen in which the government of the State cannot be carried on in accordance with the Constitution — thus enabling Art. 356.","concept_note":null},{"q_no":55,"topic":"Union-State Relations","question":"The Finance Commission is constituted under which Article?","options":{"A":"Article 279","B":"Article 280","C":"Article 281","D":"Article 282"},"correct":"B","answer_text":"Article 280","explanation":"Article 280 provides that the President shall, within two years from the commencement of the Constitution and thereafter at the expiration of every fifth year or at such earlier time as the President considers necessary, constitute a Finance Commission to recommend distribution of tax revenues.","concept_note":null},{"q_no":56,"topic":"Legislative Powers","question":"Which of the following is in the Union List (List I, Seventh Schedule)?","options":{"A":"Public order","B":"Police","C":"Defence of India","D":"Agriculture"},"correct":"C","answer_text":"Defence of India (Entry 1, List I)","explanation":"Defence of India is Entry 1 of the Union List. Public order and Police are in the State List (List II). Agriculture is in the State List (Entry 14). Education is in the Concurrent List (Entry 25, after 42nd Amendment).","concept_note":null},{"q_no":57,"topic":"Legislative Powers","question":"'Education' was originally in which List? After which Amendment was it moved to the Concurrent List?","options":{"A":"State List; moved to Concurrent List by 42nd Amendment, 1976","B":"Union List; moved by 44th Amendment","C":"Always in Concurrent List","D":"State List; moved by 86th Amendment"},"correct":"A","answer_text":"State List originally; 42nd Amendment, 1976 shifted it to Concurrent List","explanation":"Originally, 'Education' was in the State List (List II). The 42nd Constitutional Amendment Act, 1976 shifted 'Education' including universities to Entry 25 of the Concurrent List, enabling both Parliament and State Legislatures to legislate on it.","concept_note":null},{"q_no":58,"topic":"Union-State Relations","question":"Under Article 256, the executive power of every State shall be so exercised as to ensure:","options":{"A":"Compliance with Union laws made by Parliament","B":"Compliance with Governor's instructions","C":"Compliance with Supreme Court orders","D":"Compliance with Finance Commission recommendations"},"correct":"A","answer_text":"Compliance with Union laws made by Parliament","explanation":"Article 256 imposes a mandatory obligation on States to exercise their executive power so as to ensure compliance with the laws made by Parliament and any existing laws that apply in the State. The Union may give necessary directions to the State for this purpose.","concept_note":null},{"q_no":59,"topic":"Judiciary","question":"The Chief Justice of a High Court is appointed by the President in consultation with:","options":{"A":"Chief Justice of India and the Governor of the State — Article 217","B":"Chief Justice of India only","C":"The Governor only","D":"The State Council of Ministers"},"correct":"A","answer_text":"CJI and Governor of the State — Article 217","explanation":"Article 217 provides that the Chief Justice of a High Court shall be appointed by the President after consultation with the Chief Justice of India and the Governor of the State. For other HC judges, the Chief Justice of the concerned HC is also consulted.","concept_note":null},{"q_no":60,"topic":"Judiciary","question":"A High Court judge holds office until:","options":{"A":"The pleasure of the President","B":"Age of 62 years","C":"Age of 65 years","D":"Age of 60 years"},"correct":"B","answer_text":"Age 62 years — Article 217(1)","explanation":"Article 217(1) provides that a Judge of a High Court shall hold office until he attains the age of 62 years. Supreme Court judges retire at 65 years under Article 124(2).","concept_note":null},{"q_no":61,"topic":"Judiciary","question":"The power of a High Court to transfer cases from subordinate courts involving substantial constitutional questions is provided under:","options":{"A":"Article 226","B":"Article 227","C":"Article 228","D":"Article 229"},"correct":"C","answer_text":"Article 228","explanation":"Article 228 provides that if the High Court is satisfied that a case pending in a court subordinate to it involves a substantial question of law as to the interpretation of the Constitution, it may withdraw the case and either dispose of it itself or determine the question and return the case.","concept_note":null},{"q_no":62,"topic":"Judiciary","question":"Which of the following is CORRECT about High Courts' writ jurisdiction under Article 226?","options":{"A":"It is narrower than SC's writ jurisdiction under Article 32","B":"It is wider than Article 32 — can be used for enforcement of any legal right, not just FRs","C":"It is exactly the same as Article 32","D":"It can only be used against State government"},"correct":"B","answer_text":"Article 226 is wider — can enforce any legal right, not just Fundamental Rights","explanation":"Article 226 is wider than Article 32 in two respects: (1) It can be used for enforcement of any legal right, not just Fundamental Rights; (2) High Courts can issue writs against any person or authority within their territorial jurisdiction. However, Article 32 is itself a Fundamental Right, unlike Article 226.","concept_note":null},{"q_no":63,"topic":"Judiciary","question":"The concept of 'Territorial Jurisdiction' of High Courts for writ petitions means:","options":{"A":"Writs can only be filed in the State where the petitioner resides","B":"The cause of action must arise or the respondent must be located within the HC's territorial jurisdiction","C":"Only domicile of the petitioner matters","D":"Any HC in India has jurisdiction for Fundamental Rights violations"},"correct":"B","answer_text":"Cause of action must arise OR respondent located within HC's territorial jurisdiction","explanation":"Under Article 226, the High Court can issue writs to any person or authority within the territories in relation to which it exercises jurisdiction. If any part of the cause of action arises within the HC's territorial jurisdiction, it has jurisdiction. This is especially important for petitions against Central Government.","concept_note":null},{"q_no":64,"topic":"Judicial Review","question":"'Prohibition' writ differs from 'Certiorari' in that:","options":{"A":"Prohibition is issued before the inferior tribunal makes its decision; Certiorari is issued after to quash it","B":"Certiorari is preventive; Prohibition is curative","C":"Both are issued only after the decision","D":"There is no difference — both quash decisions"},"correct":"A","answer_text":"Prohibition is PREVENTIVE (before decision); Certiorari is CURATIVE (after decision to quash it)","explanation":"Prohibition is a preventive writ — issued to an inferior tribunal to stop it from exceeding jurisdiction before it makes a decision. Certiorari is a curative writ — issued after a decision to bring the record to a superior court and quash it. Both deal with jurisdictional excess.","concept_note":null},{"q_no":65,"topic":"Judicial Review","question":"'Quo Warranto' writ can be issued against:","options":{"A":"Any person performing any duty","B":"A person holding a public office without legal authority or against a person claiming a public office","C":"Any government official","D":"Courts only"},"correct":"B","answer_text":"Person holding a public office without legal authority","explanation":"Quo Warranto (Latin: 'by what authority') questions the authority by which a person holds a public office. It can be issued against a person who claims or usurps a public office. Leading case: University of Mysore v. C.D. Govinda Rao (1964). It is a discretionary writ, not a writ of right.","concept_note":null},{"q_no":66,"topic":"Judicial Review","question":"Which of the following CANNOT be enforced through a writ of Mandamus?","options":{"A":"A statutory duty of a public authority","B":"A discretionary duty where authority refuses to exercise discretion at all","C":"A private contractual obligation","D":"A duty to follow natural justice"},"correct":"C","answer_text":"Private contractual obligations — Mandamus lies only for public duties","explanation":"Mandamus is issued only to enforce PUBLIC duties — statutory or constitutional. It cannot enforce purely private contractual rights. However, if a public authority refuses to exercise its discretion altogether (as opposed to exercising it wrongly), mandamus can compel it to act.","concept_note":null},{"q_no":67,"topic":"Administrative Law","question":"The Central Administrative Tribunal (CAT) was established under:","options":{"A":"Article 323-A and the Administrative Tribunals Act, 1985","B":"Article 323-B","C":"Administrative Tribunals Act, 1976","D":"Service Conduct Rules, 1964"},"correct":"A","answer_text":"Article 323-A and the Administrative Tribunals Act, 1985","explanation":"Article 323-A (inserted by 42nd Amendment, 1976) provides for Administrative Tribunals for adjudication of disputes relating to recruitment and conditions of service of persons appointed to public services. The Administrative Tribunals Act, 1985 operationalized this provision by establishing the CAT.","concept_note":null},{"q_no":68,"topic":"Administrative Law","question":"In L. Chandra Kumar v. Union of India (1997), the Supreme Court held:","options":{"A":"CAT is the final authority on service matters","B":"Power of High Courts under Articles 226/227 cannot be excluded — it is part of the basic structure","C":"Administrative Tribunals Act is unconstitutional","D":"Only Supreme Court can review CAT decisions"},"correct":"B","answer_text":"Power of High Courts under Arts. 226/227 cannot be excluded — part of basic structure","explanation":"In L. Chandra Kumar v. Union of India (1997), a 7-judge Constitutional Bench held that the power of High Courts under Articles 226 and 227 is part of the basic structure of the Constitution and cannot be excluded even by a constitutional provision. CAT decisions are therefore subject to HC Division Bench review.","concept_note":"L. Chandra Kumar Principle: Judicial review by the High Court is a basic structure feature. Even the Constitution (through Art. 323-A(2)(d)) cannot validly exclude this jurisdiction. CAT functions as a court of first instance; its decisions go to HC Division Bench for judicial review."},{"q_no":69,"topic":"Administrative Law","question":"'Lokpal' under the Lokpal and Lokayuktas Act, 2013 has jurisdiction over:","options":{"A":"Only Central government employees below Joint Secretary level","B":"Public servants including PM (with conditions), Ministers, MPs, Group A/B/C/D officials, and certain NGOs","C":"Only Members of Parliament","D":"State government officials only"},"correct":"B","answer_text":"PM (with conditions), Ministers, MPs, Group A/B/C/D officials, and certain NGOs","explanation":"Lokpal has jurisdiction over the Prime Minister (with significant restrictions — matters relating to external affairs, security, public order excluded), Union Ministers, Members of Parliament, Group A/B/C/D officers of Union, and officers of certain entities receiving government funding.","concept_note":null},{"q_no":70,"topic":"Administrative Law","question":"The Lokpal is headed by:","options":{"A":"A retired Chief Justice of India compulsorily","B":"A person who is/has been CJI or a SC judge or an eminent person meeting prescribed criteria","C":"A sitting Supreme Court judge","D":"The Chief Vigilance Commissioner"},"correct":"B","answer_text":"Person who is/has been CJI, or SC judge, or eminent person meeting criteria","explanation":"The Lokpal Act, 2013 provides that the Chairperson shall be a person who is or has been the Chief Justice of India or a judge of the Supreme Court OR an eminent person of impeccable integrity and outstanding ability, having special knowledge and expertise of not less than 25 years in public administration.","concept_note":null},{"q_no":71,"topic":"Administrative Law","question":"Which of the following is NOT a valid ground for challenging delegated legislation in courts?","options":{"A":"Ultra vires the parent Act","B":"Violation of Fundamental Rights","C":"Procedural ultra vires — failure to follow mandatory consultation/publication","D":"The parent Act itself was passed hastily by Parliament"},"correct":"D","answer_text":"Validity of the parent Act is irrelevant when challenging delegated legislation","explanation":"Delegated legislation can be challenged on grounds of: (1) substantive ultra vires (beyond scope of parent Act); (2) violation of Fundamental Rights; (3) procedural ultra vires (failure to follow mandatory procedures); (4) unreasonableness; (5) sub-delegation without authority. The speed of passing the parent Act is NOT a ground for challenging subordinate legislation.","concept_note":null},{"q_no":72,"topic":"Administrative Law","question":"'Sub-delegation' of legislative power means:","options":{"A":"The original legislature re-delegates to a lower body","B":"The body which received delegated power further delegates to yet another body","C":"Parliament delegates to the President","D":"The President delegates to States"},"correct":"B","answer_text":"The delegate further delegates to another body","explanation":"Sub-delegation occurs when a body that has received legislative power by delegation from Parliament further delegates that power to another subordinate body. The maxim 'delegatus non potest delegare' (a delegate cannot further delegate) applies — sub-delegation is valid only if expressly or impliedly permitted by the parent Act.","concept_note":null},{"q_no":73,"topic":"Administrative Law","question":"Parliamentary control over delegated legislation operates through:","options":{"A":"Laying before Parliament — affirmative or negative resolution","B":"Committee on Subordinate Legislation","C":"Sunset clauses","D":"Both A and B"},"correct":"D","answer_text":"Both A (laying procedure) and B (Committee on Subordinate Legislation)","explanation":"Parliamentary control over delegated legislation operates through: (1) Laying procedure — affirmative resolution (both Houses must approve) or negative resolution (either House can annul within 30/40 days); (2) Committee on Subordinate Legislation in both Lok Sabha and Rajya Sabha which scrutinizes delegated legislation.","concept_note":null},{"q_no":74,"topic":"Administrative Law","question":"The doctrine of 'Legitimate Expectation' was held to give only PROCEDURAL rights (not substantive benefit) by the SC in:","options":{"A":"Navjyoti Coop. v. Union of India","B":"Union of India v. Hindustan Development Corporation (1993)","C":"Food Corporation of India v. Kamdhenu","D":"M/s Javed Ahmed v. State of Maharashtra"},"correct":"B","answer_text":"Union of India v. Hindustan Development Corporation (1993)","explanation":"In Union of India v. Hindustan Development Corporation (1993), the Supreme Court held that Legitimate Expectation gives a procedural right — the right to be heard before the expectation is defeated — but NOT a substantive right to the promised benefit. The authority can still change policy for public good.","concept_note":null},{"q_no":75,"topic":"Administrative Law","question":"'Promissory Estoppel' against the Government was confirmed in Indian law in which case?","options":{"A":"Century Spg. & Mfg. Co. v. Ulhas Nagar Municipality","B":"M/s Motilal Padampat Sugar Mills v. State of UP (1979)","C":"State of Punjab v. Okara Grain Buyers","D":"A.K. Kraipak v. Union of India"},"correct":"B","answer_text":"M/s Motilal Padampat Sugar Mills v. State of UP (1979)","explanation":"In Motilal Padampat Sugar Mills v. State of UP (1979), the Supreme Court confirmed that the doctrine of promissory estoppel applies against the Government in India. The State had given an exemption from sales tax and the SC held the Government was estopped from withdrawing it after the company acted on the representation.","concept_note":"Promissory Estoppel vs Legitimate Expectation: Promissory Estoppel — equitable doctrine; government cannot retract a representation if the party acted on it to its detriment. Legitimate Expectation — public law doctrine; gives right to be heard before expectation is defeated, but not necessarily the promised benefit."},{"q_no":76,"topic":"Natural Justice","question":"'Reasoned decision' as a requirement of natural justice is NOT mandatory when:","options":{"A":"The decision is merely recommendatory","B":"The statute expressly excludes it","C":"It concerns national security or confidential matters","D":"All of the above"},"correct":"D","answer_text":"All of the above","explanation":"Duty to give reasons can be excluded when: (1) the decision is merely recommendatory and not final; (2) the statute expressly excludes the requirement; (3) reasons would endanger national security or confidential information; (4) where the context makes it impractical.","concept_note":null},{"q_no":77,"topic":"Natural Justice","question":"Which case established that the right to cross-examine witnesses is NOT always part of natural justice in administrative proceedings?","options":{"A":"Ridge v. Baldwin","B":"Board of Education v. Rice (1911)","C":"Russell v. Duke of Norfolk (1949)","D":"A.K. Kraipak"},"correct":"C","answer_text":"Russell v. Duke of Norfolk (1949)","explanation":"In Russell v. Duke of Norfolk (1949), the court held that the requirements of natural justice depend on the circumstances of the case, the statutory framework, and the nature of inquiry. Cross-examination of witnesses is not always required — it depends on whether it would materially assist the inquiry.","concept_note":null},{"q_no":78,"topic":"Fundamental Rights","question":"The maxim 'Nemo bis punitur pro eodem delicto' means:","options":{"A":"No one shall be punished twice for the same offence — relates to double jeopardy (Article 20(2))","B":"No one shall be a judge in his own cause","C":"Hear the other side","D":"Act of the court shall not harm anyone"},"correct":"A","answer_text":"No one shall be punished twice for the same offence — double jeopardy (Article 20(2))","explanation":"Nemo bis punitur pro eodem delicto means 'no one shall be punished twice for the same offence.' It is the foundation of the double jeopardy rule in Article 20(2) of the Constitution which provides that no person shall be prosecuted and punished for the same offence more than once.","concept_note":null},{"q_no":79,"topic":"Natural Justice","question":"In which case did the SC hold that natural justice is flexible and depends on statutory context, nature of power, and consequences for the individual?","options":{"A":"Union of India v. Col. J.N. Sinha (1970)","B":"Maneka Gandhi v. Union of India (1978)","C":"A.K. Kraipak v. Union of India (1970)","D":"Swadeshi Cotton Mills v. Union of India (1981)"},"correct":"D","answer_text":"Swadeshi Cotton Mills v. Union of India (1981)","explanation":"In Swadeshi Cotton Mills v. Union of India (1981), the Supreme Court held that natural justice is not a monolithic or inflexible concept. Its content and extent depend on: (1) the statutory framework; (2) the nature of the power exercised; (3) the consequences for the person affected; (4) public interest considerations.","concept_note":null},{"q_no":80,"topic":"Natural Justice","question":"Under the 'Doctrine of Fairness' in administrative law, the concept of fairness:","options":{"A":"Is identical to natural justice","B":"Is wider than natural justice and can apply even where there is no traditional NJ requirement — based on good administration","C":"Is narrower than natural justice","D":"Applies only to courts"},"correct":"B","answer_text":"Wider than natural justice — applies even without traditional NJ requirements — based on good administration","explanation":"The 'duty to act fairly' has emerged as a broader concept than the traditional rules of natural justice. It looks at the overall fairness of the administrative process and applies even in situations where the strict rules of natural justice may not be triggered. It evolved in English and Indian administrative law post-Maneka Gandhi.","concept_note":null},{"q_no":81,"topic":"Judicial Review","question":"'Jurisdictional error' in administrative law traditionally referred to:","options":{"A":"Any error of law in a decision","B":"An error going to the root of jurisdiction — acting without jurisdiction, exceeding jurisdiction, or refusing to exercise jurisdiction","C":"An error in applying the law correctly within jurisdiction","D":"A procedural error"},"correct":"B","answer_text":"Error going to the root of jurisdiction — acting without, in excess of, or refusing to exercise jurisdiction","explanation":"Traditional jurisdictional errors were of three types: (1) No jurisdiction — acting without any authority; (2) Excess of jurisdiction — exceeding the granted authority; (3) Failure to exercise jurisdiction — refusing to exercise power lawfully vested. Anisminic (1969) effectively widened this to include all errors of law.","concept_note":null},{"q_no":82,"topic":"Judicial Review","question":"The 'Doctrine of Proportionality' is STRICTER than Wednesbury unreasonableness in the sense that:","options":{"A":"Courts can substitute their own decision for the administrative decision","B":"Under proportionality, courts examine whether less restrictive means could be used — performing a balancing exercise; Wednesbury only asks if the decision was outrageous","C":"Proportionality applies only to criminal matters","D":"Proportionality gives more deference to administration"},"correct":"B","answer_text":"Proportionality requires balancing exercise — courts ask if less restrictive means could be used","explanation":"Wednesbury asks: was the decision so unreasonable that no reasonable authority could have made it? Proportionality asks: (1) Was the objective legitimate? (2) Were the means suitable? (3) Were the means necessary — could less restrictive means achieve the same goal? (4) Was there a fair balance between rights and public interest? Proportionality is a much more intensive review.","concept_note":null},{"q_no":83,"topic":"Judicial Review","question":"'Colourable exercise of power' in judicial review of administrative action means:","options":{"A":"The authority acted with improper motive — exercises a power for an unauthorized purpose","B":"The authority made an error of fact","C":"The authority acted irrationally","D":"The authority exceeded its jurisdiction"},"correct":"A","answer_text":"Authority acted with improper motive — exercised power for an unauthorized purpose","explanation":"Colourable exercise of power (also called 'abuse of power' or 'fraud on power') means the authority exercises its power for a purpose other than the one for which it was granted — i.e., the purpose was dressed up as something else. The substance, not the form, is examined.","concept_note":null},{"q_no":84,"topic":"Judicial Review","question":"Which of the following is the CORRECT order of remedies from most available to most restricted?","options":{"A":"Certiorari → Mandamus → Prohibition → Habeas Corpus → Quo Warranto","B":"Habeas Corpus → Mandamus → Certiorari → Prohibition → Quo Warranto","C":"Quo Warranto → Habeas Corpus → Certiorari","D":"No particular order — all equally available"},"correct":"B","answer_text":"Habeas Corpus (most available — liberty cases) → ... → Quo Warranto (most restricted — public office only)","explanation":"Habeas Corpus is the most readily available writ for protection of personal liberty — any person can apply regardless of locus standi in cases of illegal detention. Quo Warranto is the most restricted — it can only be sought against a person holding a public office without authority. The others fall in between.","concept_note":null},{"q_no":85,"topic":"Judicial Review","question":"The 'Doctrine of Exhaustion of Remedies' in judicial review means:","options":{"A":"Courts should always be approached first","B":"A party must exhaust all available statutory/alternative remedies before seeking judicial review, unless those remedies are inadequate or the case involves FRs or jurisdictional issues","C":"Writs cannot be filed at all if any other remedy exists","D":"Only applies in criminal matters"},"correct":"B","answer_text":"Must exhaust alternative remedies first — unless they are inadequate or FRs/jurisdictional issues are involved","explanation":"The Doctrine of Exhaustion of Remedies is a procedural doctrine — courts generally require parties to exhaust available alternative remedies before granting judicial review. Exceptions: (1) alternative remedy is inadequate/illusory; (2) Fundamental Rights are directly infringed; (3) pure jurisdictional question; (4) natural justice violation. It is a rule of prudence, not an absolute bar.","concept_note":null},{"q_no":86,"topic":"Judicial Review","question":"In Tata Cellular v. Union of India (1994), the Supreme Court established that judicial review of government contracts:","options":{"A":"Is not available for commercial decisions","B":"Is available but courts should not substitute their commercial judgment — review limited to illegality, irrationality, procedural impropriety","C":"Applies the same strict standard as constitutional review","D":"Government contracts are immune from judicial review"},"correct":"B","answer_text":"Available but limited — courts do not substitute commercial judgment; apply illegality/irrationality/procedural impropriety","explanation":"In Tata Cellular v. Union of India (1994), the SC adopted Lord Diplock's three grounds from the GCHQ case for reviewing government contracts. Courts do not sit as a tender evaluation body — they only examine whether the process was legal, rational, and procedurally proper. Commercial wisdom of the decision is not reviewed.","concept_note":null},{"q_no":87,"topic":"Administrative Law","question":"The 'Doctrine of Pleasure' under Article 310 does NOT apply to:","options":{"A":"Officers of All India Services","B":"Members of Defence Services","C":"Judges of Supreme Court and High Courts — they hold office 'during good behaviour'","D":"Constitutional authorities appointed under special provisions"},"correct":"C","answer_text":"Judges of SC and HC — they hold office during good behaviour, not pleasure","explanation":"Article 310 establishes the doctrine of pleasure for government servants. However, judges of the SC (Article 124) and HC (Article 217) hold office during 'good behaviour' — they can only be removed by the impeachment process under Articles 124(4) and 217(1)(b)/(3), not at the pleasure of the President.","concept_note":null},{"q_no":88,"topic":"Governor","question":"Assertion (A): The Governor cannot be sued in a personal capacity during tenure. Reason (R): Article 361 confers complete immunity from criminal proceedings and civil proceedings during tenure.","options":{"A":"Both A and R are true and R is the correct explanation","B":"Both A and R are true but R is not the correct explanation","C":"A is true but R is false","D":"A is false but R is true"},"correct":"A","answer_text":"Both A and R are true and R is the correct explanation","explanation":"Article 361 provides complete immunity to the President and Governor: no criminal proceedings during tenure, and for civil proceedings for personal acts, 2 months' notice is required. R correctly and completely explains A.","concept_note":null},{"q_no":89,"topic":"Emergency Provisions","question":"Assertion (A): National Emergency once proclaimed continues indefinitely unless revoked. Reason (R): Parliamentary approval by special majority is required every six months for continuation.","options":{"A":"Both A and R are true and R is the correct explanation of A","B":"Both A and R are true but R is not the correct explanation","C":"A is true but R is false","D":"A is false but R is true"},"correct":"D","answer_text":"A is FALSE — it does NOT continue indefinitely. R is TRUE — 6-monthly renewal by special majority is required","explanation":"A is false because National Emergency does NOT continue indefinitely — it requires 6-monthly renewal by special majority. R is true — the mechanism is 6-monthly renewal by special majority under Article 352(6). A is the wrong statement; R is the correct rule.","concept_note":null},{"q_no":90,"topic":"Governor","question":"Assertion (A): Article 200 empowers Governor to withhold assent to a Bill passed by State Legislature. Reason (R): If Governor withholds assent and State Legislature re-passes the Bill, Governor must give assent.","options":{"A":"Both A and R are true and R is the correct explanation","B":"Both A and R are true but R is not the correct explanation of A","C":"A is true but R is false — Governor can again withhold","D":"A is false but R is true"},"correct":"B","answer_text":"Both A and R are true but R is a separate rule — not the explanation of why A exists","explanation":"A is true — Article 200 does empower the Governor to withhold assent. R is also true — if the State Legislature re-passes a Bill, the Governor must give assent. But R is not the EXPLANATION of A — it is a separate rule about the consequence of re-passing. The two propositions are related but R does not explain A.","concept_note":null},{"q_no":91,"topic":"Union Executive","question":"Match: (i) Article 123 (ii) Article 213 (iii) Article 72 (iv) Article 161 with (a) Ordinance by Governor (b) Pardoning power of President (c) Ordinance by President (d) Pardoning power of Governor","options":{"A":"i-c, ii-a, iii-b, iv-d","B":"i-a, ii-c, iii-d, iv-b","C":"i-c, ii-a, iii-d, iv-b","D":"i-b, ii-a, iii-c, iv-d"},"correct":"A","answer_text":"i-c, ii-a, iii-b, iv-d","explanation":"Article 123 (c) — President's Ordinance-making power. Article 213 (a) — Governor's Ordinance-making power. Article 72 (b) — President's pardoning power including death sentences. Article 161 (d) — Governor's pardoning power (State law offences, NOT death sentences).","concept_note":null},{"q_no":92,"topic":"Parliament","question":"Which of the following about Parliamentary privileges is/are CORRECT? (i) Freedom of speech in Parliament is absolute; (ii) A Member can be arrested for a criminal offence even during session; (iii) Parliamentary proceedings cannot be questioned in any court; (iv) Strangers can be excluded from galleries","options":{"A":"(i) and (iii) only","B":"(ii), (iii), and (iv) only","C":"(i), (ii), and (iii) only","D":"All of the above"},"correct":"B","answer_text":"(ii), (iii), and (iv) only","explanation":"(i) is INCORRECT — freedom of speech in Parliament is subject to rules/orders of Parliament, not absolute; (ii) CORRECT — no immunity from criminal arrest (only civil arrest immunity); (iii) CORRECT — Article 105(2) courts cannot question proceedings; (iv) CORRECT — both Houses can exclude strangers from galleries during session.","concept_note":null},{"q_no":93,"topic":"Parliament","question":"Arrange these Constitutional Amendments in chronological order (earliest first): (i) Insertion of Fundamental Duties (51-A); (ii) Right to Property ceased to be Fundamental Right; (iii) 'Socialist' and 'Secular' in Preamble; (iv) 10th Schedule (Anti-Defection)","options":{"A":"(i), (iii), (ii), (iv)","B":"(iii), (i), (ii), (iv)","C":"(ii), (i), (iii), (iv)","D":"(iii) and (i) together (1976), then (ii) (1978), then (iv) (1985)"},"correct":"D","answer_text":"42nd Amendment (1976) — both (iii) and (i) simultaneously → 44th Amendment (1978) → 52nd Amendment (1985)","explanation":"42nd Amendment, 1976 — inserted both (iii) 'Socialist' and 'Secular' in Preamble AND (i) Fundamental Duties (Art. 51-A) in the same amendment. 44th Amendment, 1978 — removed (ii) right to property as FR. 52nd Amendment, 1985 — inserted (iv) Tenth Schedule (Anti-Defection Law).","concept_note":null},{"q_no":94,"topic":"Parliament","question":"Which of the following Schedules relates to the languages recognized by the Constitution?","options":{"A":"Seventh Schedule","B":"Eighth Schedule","C":"Ninth Schedule","D":"Tenth Schedule"},"correct":"B","answer_text":"Eighth Schedule — originally 14 languages; now 22 languages","explanation":"The Eighth Schedule contains the list of languages officially recognized by the Constitution. Originally 14 languages at inception; now 22 languages after various amendments. The 8th Schedule is also relevant for Official Language purposes under Articles 344 and 351.","concept_note":null},{"q_no":95,"topic":"Union-State Relations","question":"Under Article 344, the President shall constitute an Official Languages Commission within how many years of commencement of Constitution?","options":{"A":"5 years of commencement","B":"10 years of commencement","C":"15 years","D":"On Parliament's direction only"},"correct":"A","answer_text":"5 years — and again at the end of 10 years","explanation":"Article 344 requires the President to constitute a Commission at the expiration of 5 years from commencement of the Constitution, and again at the expiration of 10 years, to report on the progressive use of Hindi as official language and restrictions on the use of English.","concept_note":null},{"q_no":96,"topic":"Legislative Powers","question":"The 'Three Lists' system of legislative distribution in the Indian Constitution was immediately borrowed from:","options":{"A":"USA","B":"Australia","C":"Canada","D":"Government of India Act, 1935"},"correct":"D","answer_text":"Government of India Act, 1935 — the immediate predecessor","explanation":"The three-list scheme (Federal List, Provincial List, Concurrent List) was first introduced in the Government of India Act, 1935. The Constitution carried this forward as Union List, State List, and Concurrent List in the Seventh Schedule. Canada's Constitution had two lists; the US has enumerated + reserved powers.","concept_note":null},{"q_no":97,"topic":"Judicial Review","question":"'Judicial activism' in India is associated with the expansion of jurisdiction through:","options":{"A":"PIL, epistolary jurisdiction, and expanded interpretation of Article 21","B":"Strict application of procedural rules","C":"Limiting the scope of writ jurisdiction","D":"Refusing to interfere in executive matters"},"correct":"A","answer_text":"PIL, epistolary jurisdiction, and expanded interpretation of Article 21","explanation":"Judicial activism in India is associated with: (1) Public Interest Litigation (PIL) — any public spirited person can approach courts; (2) Epistolary jurisdiction — letters to the court can be treated as writ petitions; (3) Expansive interpretation of Article 21 to include numerous uncontained rights. Pioneered by Justices P.N. Bhagwati and V.R. Krishna Iyer.","concept_note":null},{"q_no":98,"topic":"Fundamental Rights","question":"In Vishaka v. State of Rajasthan (1997), the Supreme Court:","options":{"A":"Declared sexual harassment at workplace as a criminal offence","B":"Laid down guidelines treating sexual harassment at workplace as violation of Articles 14, 19, and 21 — filled the legislative vacuum","C":"Upheld conviction under existing law","D":"Ordered Parliament to legislate within 3 months"},"correct":"B","answer_text":"Laid down guidelines — filled legislative vacuum — sexual harassment violates Arts. 14, 19, 21","explanation":"Vishaka v. State of Rajasthan (1997) — the SC laid down the Vishaka Guidelines treating sexual harassment at workplace as a violation of Articles 14, 15, 19(1)(g), and 21. These Guidelines had the force of law until the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013 was enacted.","concept_note":null},{"q_no":99,"topic":"Union-State Relations","question":"The Punchhi Commission (2010) was set up to review:","options":{"A":"Centre-State financial relations only","B":"Centre-State relations broadly — constitutional federalism, Governor's role, Article 356, inter-State water disputes","C":"Judicial appointments","D":"Electoral reforms"},"correct":"B","answer_text":"Centre-State relations broadly — federalism, Governor's role, Article 356, water disputes","explanation":"The Punchhi Commission (headed by former CJI Madan Mohan Punchhi, 2010) was constituted to review the working of the constitutional scheme of Centre-State relations. It recommended: restraint in use of Art. 356; Governors to be constitutional heads; delimitation of Governor's discretionary powers; strengthening Inter-State Council.","concept_note":null},{"q_no":100,"topic":"Judicial Review","question":"Which Article provides for an independent body to audit accounts of the Union and States — the CAG?","options":{"A":"Article 148 — Comptroller and Auditor General of India","B":"Article 149","C":"Article 150","D":"Article 151"},"correct":"A","answer_text":"Article 148 — Comptroller and Auditor General of India","explanation":"Article 148 establishes the Comptroller and Auditor General of India. The CAG is appointed by the President and can be removed only in the same manner as a Supreme Court judge. Article 149 defines the duties and powers of CAG. Article 151 provides for presentation of CAG reports to Parliament/State Legislature.","concept_note":null},{"q_no":101,"topic":"Emergency Provisions","question":"After the 44th Amendment, 1978, which two Fundamental Rights CANNOT be suspended even during National Emergency?","options":{"A":"Articles 14 and 19","B":"Articles 19 and 21","C":"Articles 20 and 21","D":"Articles 21 and 22"},"correct":"C","answer_text":"Articles 20 and 21 — non-suspendable by 44th Amendment, 1978","explanation":"The 44th Amendment, 1978 amended Article 359 to provide that the President cannot suspend the enforcement of Articles 20 and 21 even during a National Emergency. This was a direct response to the abuse of emergency powers during 1975-77.","concept_note":null},{"q_no":102,"topic":"Governor","question":"In Nabam Rebia v. Deputy Speaker, Arunachal Pradesh (2016), the Supreme Court held:","options":{"A":"The Governor can summon a session of the Assembly at any time on his own","B":"The Governor's power to advance the session was unconstitutional — he cannot act contrary to advice of Council of Ministers on summoning sessions","C":"The Governor has absolute discretion in all Assembly matters","D":"The Speaker can be removed by the Governor"},"correct":"B","answer_text":"Governor's power to advance the session was unconstitutional — he acts on CoM advice on summoning","explanation":"In Nabam Rebia v. Deputy Speaker (2016), the SC held that summoning, proroguing, and dissolving the State Legislative Assembly are matters on which the Governor must act on the advice of the Council of Ministers. The Governor cannot advance the session on his own to destabilize an elected government.","concept_note":null},{"q_no":103,"topic":"Fundamental Rights","question":"In I.R. Coelho v. State of Tamil Nadu (2007), the nine-judge bench held regarding the Ninth Schedule:","options":{"A":"All laws in the Ninth Schedule are immune from all Constitutional challenges","B":"Laws before April 24, 1973 are fully protected; laws after that date can be challenged if they violate basic structure or damage FRs forming part of basic structure","C":"The Ninth Schedule is itself unconstitutional","D":"Only property-related laws in Ninth Schedule are protected"},"correct":"B","answer_text":"Laws before April 24, 1973 (Kesavananda date) protected; after that — can be challenged if they violate basic structure","explanation":"I.R. Coelho v. State of Tamil Nadu (2007) — 9-judge bench held: laws inserted in 9th Schedule before April 24, 1973 (date of Kesavananda Bharati) are fully protected; laws inserted after that date are open to challenge if they violate the basic structure or if fundamental rights
